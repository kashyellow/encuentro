provide regarding your age is truthful and accurate;","You will not allow a person under 18 to access or use your account."]},{id:3,title:"3. ACCOUNT REGISTRATION",titleEs:"3. REGISTRO DE CUENTA",paragraphs:["To use certain features of Global Amor, you may be required to create an account. You agree to provide information that is accurate, current, and complete.","You are responsible for maintaining the confidentiality of your account credentials and for activity occurring through your account unless you can demonstrate that the activity occurred without your authorization and despite reasonable precautions.","You must notify Global Amor promptly if you believe your account has been compromised."],bullets:["Create an account using false information;","Misrepresent your age;","Pretend to be another person;","Use another person’s photographs without permission;","Create an account for another person without authorization;","Create multiple accounts for deceptive purposes;","Create accounts after being banned or suspended;","Use an account belonging to another person;","Provide information intended to deceive or mislead other users."]},{id:4,title:"4. AUTHENTICITY OF PROFILES",titleEs:"4. AUTENTICIDAD DE PERFILES",paragraphs:["Global Amor is designed around authentic interactions between adults. You agree that information contained in your profile should be truthful and not materially misleading.","You must not intentionally misrepresent: Your identity; Your age; Your relationship status; Your location; Your occupation; Your photographs; Your intentions; Your financial circumstances; Your education; Your marital status; Your relationship history; or Other information where the misrepresentation is intended to deceive another user.","Global Amor does not guarantee that every profile or statement made by a user is accurate. Users should exercise appropriate caution when interacting with people online."]},{id:5,title:"5. INTENDED USE OF GLOBAL AMOR",titleEs:"5. USO PREVISTO",paragraphs:["Global Amor may only be used for lawful purposes consistent with its purpose as an adult dating and social platform.","You agree not to use the Service primarily for advertising unrelated products, recruiting customers, employees, MLM, affiliate marketing, political campaigning, religious solicitation, fundraising, spam, lead generation, data collection, promoting unrelated websites, recruiting for other dating services, escort or sexual services, financial solicitation, fraudulent schemes, crypto solicitation, gambling, or any other commercial or non-dating purpose.","You may not use Global Amor as a substitute for a general advertising platform, classified-advertising service, employment platform, or financial solicitation platform."]},{id:6,title:"6. PROHIBITED COMMERCIAL AND SEXUAL SOLICITATION",titleEs:"6. SOLICITACIÓN COMERCIAL Y SEXUAL PROHIBIDA",paragraphs:["Global Amor is not a marketplace for sexual services. You may not use Global Amor to advertise, offer, arrange, promote, sell, purchase, or solicit prostitution, escort services, sexual services, paid dates, sexual content for compensation, or any substantially similar commercial sexual arrangement.","You may not use profile descriptions, messages, photographs, links, usernames, or other features of Global Amor to facilitate such activity. This prohibition applies whether compensation is offered directly or indirectly.","Global Amor may remove accounts or content that appear to facilitate prohibited commercial sexual activity."]},{id:7,title:"7. FINANCIAL SOLICITATION, SCAMS, AND FRAUD",titleEs:"7. SOLICITACIÓN FINANCIERA, ESTAFAS Y FRAUDE",paragraphs:["Global Amor strictly prohibits scams and fraudulent activity. You may not use the Service to deceive another person for financial or personal gain.","Prohibited conduct includes asking for money, loans, gift cards, cryptocurrency, wire transfers, bank-account or credit-card information, investment solicitation, romance scams, impersonatio mor does not conduct personal background investigations on every user and does not guarantee that a user has no criminal history or poses no safety risk. You are solely responsible for deciding whether, when, where, and how to meet another person."]},{id:11,title:"11. HARASSMENT AND ABUSE",titleEs:"11. ACOSO Y ABUSO",paragraphs:["You may not use Global Amor to harass, intimidate, threaten, stalk, bully, abuse, or repeatedly contact another person against their wishes.","Prohibited behavior includes threats of violence, stalking, repeated unwanted contact, sexual harassment, intimidation, extortion, blackmail, humiliation, targeted harassment, hate-based harassment, encouraging self-harm, threatening to disclose private or intimate images, repeatedly contacting someone after they asked you to stop, or coordinating harassment.","We may take action based on reported behavior even when conduct occurs partly outside Global Amor if it materially affects the safety or integrity of the Service or its users."]},{id:12,title:"12. NON-CONSENSUAL INTIMATE CONTENT",titleEs:"12. CONTENIDO ÍNTIMO NO CONSENSUADO",paragraphs:["You may not upload, send, distribute, threaten to distribute, or otherwise share intimate photographs or videos of another person without that person’s consent.","You may not use intimate images to threaten, blackmail, extort money, humiliate, retaliate, or pressure another person into a relationship or sexual activity. Threatening to release intimate content may itself constitute prohibited conduct.","Global Amor may remove reported content and take appropriate action against accounts involved in suspected non-consensual intimate-image activity."]},{id:13,title:"13. MINORS AND CHILD SAFETY",titleEs:"13. MENORES Y SEGURIDAD INFANTIL",paragraphs:["Global Amor has zero tolerance for sexual exploitation or abuse involving minors.","You may not use the Service to contact minors for sexual purposes, request sexual images from a minor, share sexual content involving

ationships, or legitimate social interaction.","We reserve the right to determine, in our reasonable discretion, whether an account or activity is inconsistent with the intended purpose of the Service."]},{id:2,title:"2. AGE REQUIREMENT — 18+ ONLY",titleEs:"2. REQUISITO DE EDAD — SOLO 18+",paragraphs:["Global Amor is strictly limited to individuals who are 18 years of age or older. By registering for or using Global Amor, you represent and warrant that:","You may be required to confirm your age before accessing certain portions of the Service. If we discover or reasonably believe that an individual is under 18, we may immediately suspend or terminate the account and remove associated content.","If you believe that a person under 18 is using Global Amor, please report the account to us immediately."],bullets:["You are at least 18 years old;","You have the legal capacity to enter into these Terms;","You are not prohibited by law from using an online dating service;","The information you provide regarding your age is truthful and accurate;","You will not allow a person under 18 to access or use your account."]},{id:3,title:"3. ACCOUNT REGISTRATION",titleEs:"3. REGISTRO DE CUENTA",paragraphs:["To use certain features of Global Amor, you may be required to create an account. You agree to provide information that is accurate, current, and complete.","You are responsible for maintaining the confidentiality of your account credentials and for activity occurring through your account unless you can demonstrate that the activity occurred without your authorization and despite reasonable precautions.","You must notify Global Amor promptly if you believe your account has been compromised."],bullets:["Create an account using false information;","Misrepresent your age;","Pretend to be another person;","Use another person’s photographs without permission;","Create an account for another person without authorization;","Create multiple accounts for deceptive purposes;","Create accounts after being banned or suspended;","Use an account belonging to another person;","Provide information intended to deceive or mislead other users."]},{id:4,title:"4. AUTHENTICITY OF PROFILES",titleEs:"4. AUTENTICIDAD DE PERFILES",paragraphs:["Global Amor is designed around authentic interactions between adults. You agree that information contained in your profile should be truthful and not materially misleading.","You must not intentionally misrepresent: Your identity; Your age; Your relationship status; Your location; Your occupation; Your photographs; Your intentions; Your financial circumstances; Your education; Your marital status; Your relationship history; or Other information where the misrepresentation is intended to deceive another user.","Global Amor does not guarantee that every profile or statement made by a user is accurate. Users should exercise appropriate caution when interacting with people online."]},{id:5,title:"5. INTENDED USE OF GLOBAL AMOR",titleEs:"5. USO PREVISTO",paragraphs:["Global Amor may only be used for lawful purposes consistent with its purpose as an adult dating and social platform.","You agree not to use the Service primarily for advertising unrelated products, recruiting customers, employees, MLM, affiliate marketing, political campaigning, religious solicitation, fundraising, spam, lead generation, data collection, promoting unrelated websites, recruiting for other dating services, escort or sexual services, financial solicitation, fraudulent schemes, crypto solicitation, gambling, or any other commercial or non-dating purpose.","You may not use Global Amor as a substitute for a general advertising platform, classified-advertising service, employment platform, or financial solicitation platform."]},{id:6,title:"6. PROHIBITED COMMERCIAL AND SEXUAL SOLICITATION",titleEs:"6. SOLICITACIÓN COMERCIAL Y SEXUAL PROHIBIDA",paragraphs:["Global Amor is not a marketplace for sexual services. You may not use Global Amor to advertise, offer, arrange, promote, sell, purchase, or solicit prostitution, escort services, sexual services, paid dates, sexual content for compensation, or any substantially similar commercial sexual arrangement.","You may not use profile descriptions, messages, photographs, links, usernames, or other features of Global Amor to facilitate such activity. This prohibition applies whether compensation is offered directly or indirectly.","Global Amor may remove accounts or content that appear to facilitate prohibited commercial sexual activity."]},{id:7,title:"7. FINANCIAL SOLICITATION, SCAMS, AND FRAUD",titleEs:"7. SOLICITACIÓN FINANCIERA, ESTAFAS Y FRAUDE",paragraphs:["Global Amor strictly prohibits scams and fraudulent activity. You may not use the Service to deceive another person for financial or personal gain.","Prohibited conduct includes asking for money, loans, gift cards, cryptocurrency, wire transfers, bank-account or credit-card information, investment solicitation, romance scams, impersonation, fake emergencies, advance-fee schemes, Ponzi schemes, identity theft, money laundering, and any other fraudulent activity.","Global Amor may suspend or terminate accounts suspected of participating in fraudulent activity, including where we reasonably believe that additional investigation or verification is appropriate."]},{id:8,title:"8. NO GUARANTEE OF USER IDENTITY",titleEs:"8. SIN GARANTÍA DE IDENTIDAD",paragraphs:["Global Amor does not guarantee that any user is who they claim to be. Although we may implement verification, moderation, safety measures, or other safeguards, no online identity-verification system can guarantee that a person is genuine, safe, honest, or accurately represented.","You are responsible for exercising your own judgment when communicating with another user. Do not assume that a profile photograph, verification indicator, telephone number, social-media account, or other information proves a person’s identity."]},{id:9,title:"9. PERSONAL SAFETY",titleEs:"9. SEGURIDAD PERSONAL",paragraphs:["Online dating involves inherent risks. You acknowledge that you are responsible for taking reasonable precautions when interacting with other users.","You should consider communicating through Global Amor before sharing personal contact information, avoiding disclosure of sensitive personal information, not sending money to someone you met online, meeting in public locations, informing someone you trust about your plans, maintaining control of your own transportation, avoiding excessive alcohol during initial meetings, leaving immediately if you feel unsafe, and contacting emergency services if necessary.","Global Amor does not guarantee your safety during online or offline interactions."]},{id:10,title:"10. OFFLINE MEETINGS",titleEs:"10. ENCUENTROS FUERA DE LÍNEA",paragraphs:["Global Amor is not responsible for meetings or interactions that occur outside the Service. If you choose to meet another user in person, you do so at your own risk.","Global Amor does not conduct personal background investigations on every user and does not guarantee that a user has no criminal history or poses no safety risk. You are solely responsible for deciding whether, when, where, and how to meet another person."]},{id:11,title:"11. HARASSMENT AND ABUSE",titleEs:"11. ACOSO Y ABUSO",paragraphs:["You may not use Global Amor to harass, intimidate, threaten, stalk, bully, abuse, or repeatedly contact another person against their wishes.","Prohibited behavior includes threats of violence, stalking, repeated unwanted contact, sexual harassment, intimidation, extortion, blackmail, humiliation, targeted harassment, hate-based harassment, encouraging self-harm, threatening to disclose private or intimate images, repeatedly contacting someone after they asked you to stop, or coordinating harassment.","We may take action based on reported behavior even when conduct occurs partly outside Global Amor if it materially affects the safety or integrity of the Service or its users."]},{id:12,title:"12. NON-CONSENSUAL INTIMATE CONTENT",titleEs:"12. CONTENIDO ÍNTIMO NO CONSENSUADO",paragraphs:["You may not upload, send, distribute, threaten to distribute, or otherwise share intimate photographs or videos of another person without that person’s consent.","You may not use intimate images to threaten, blackmail, extort money, humiliate, retaliate, or pressure another person into a relationship or sexual activity. Threatening to release intimate content may itself constitute prohibited conduct.","Global Amor may remove reported content and take appropriate action against accounts involved in suspected non-consensual intimate-image activity."]},{id:13,title:"13. MINORS AND CHILD SAFETY",titleEs:"13. MENORES Y SEGURIDAD INFANTIL",paragraphs:["Global Amor has zero tolerance for sexual exploitation or abuse involving minors.","You may not use the Service to contact minors for sexual purposes, request sexual images from a minor, share sexual content involving a minor, attempt to arrange a sexual encounter with a minor, facilitate exploitation or trafficking of minors, misrepresent yourself to gain access to minors, or use Global Amor for any unlawful activity involving children.","Any content or activity that may involve child sexual exploitation may be reported to appropriate authorities or relevant organizations where required or appropriate."]},{id:14,title:"14. ILLEGAL ACTIVITY",titleEs:"14. ACTIVIDAD ILEGAL",paragraphs:["You may not use Global Amor to plan, facilitate, encourage, advertise, or participate in unlawful activity including fraud, theft, extortion, trafficking, exploitation, money laundering, identity theft, threats of violence, distribution of illegal substances, sale of illegal goods, sexual exploitation, child exploitation, cybercrime, or other unlawful conduct.","We may cooperate with law enforcement authorities when required by law or when we reasonably believe disclosure is necessary to address an emergency, protect individuals, investigate suspected unlawful activity, or protect our rights."]},{id:15,title:"15. HATE, DISCRIMINATION, AND EXTREMIST CONTENT",titleEs:"15. ODIO, DISCRIMINACIÓN Y EXTREMISMO",paragraphs:["You may not use Global Amor to threaten, harass, or promote violence against individuals or groups based on protected characteristics. We may remove content that promotes violence, dehumanization, or serious harassment.","Global Amor may also restrict accounts associated with extremist or violent organizations where such activity conflicts with the purpose or safety of the Service."]},{id:16,title:"16. CONTENT YOU MAY NOT POST",titleEs:"16. CONTENIDO PROHIBIDO",paragraphs:["You may not upload, transmit, publish, or send content that is unlawful, fraudulent, intentionally deceptive, infringes another person’s rights, contains another person’s private information without authorization, contains malicious software, facilitates criminal activity, contains sexual exploitation material, contains non-consensual intimate content, threatens violence, constitutes harassment, attempts to scam users, is primarily commercial spam, impersonates another person, infringes intellectual-property rights, or otherwise violates these Terms.","Global Amor may remove content that violates these Terms or that we reasonably believe creates a safety, legal, or operational risk."]},{id:17,title:"17. PHOTOS AND PROFILE CONTENT",titleEs:"17. FOTOS Y CONTENIDO DE PERFIL",paragraphs:["You are responsible for the photographs and other content you upload. You represent that you have the necessary rights to use photographs you upload.","You should not upload another person’s photographs without permission, images intended to impersonate another person, private images of another person, images containing minors in inappropriate or prohibited circumstances, content that violates applicable law, or images designed primarily to facilitate prohibited commercial activity.","Global Amor may remove profile       document.querySelectorAll('div.bg-white.rounded-\[20px\].overflow-hidden').forEach(el=>{
        if(el.querySelector('.__adminDelMerch')) return;
        const btn = document.createElement('button');
        btn.className = '__adminDelMerch mt-2 w-full h-9 rounded-full bg-red-600 text-white text-[12px] font-bold';
        btn.textContent = 'Delete Merch (Admin)';
        btn.onclick = async ()=>{
          if(!confirm('Delete this merch item for everyone?')) return;
          const client = await getClient();
          const titleEl = el.querySelector('h3.serif');
          const title = titleEl ? titleEl.textContent.trim() : '';
          const {data} = await client.from('merch').select('id,title').ilike('title', `%${title.slice(0,15)}%`).limit(3);
          const target = data && data[0];
          if(target){
            const {error} = await client.from('merch').delete().eq('id', target.id);
            if(error) alert(error.message); else {el.remove(); alert('Merch deleted');}
          } else {
            alert('Could not find merch ID - delete from Table Editor > merch');
          }
        };
        // Insert after the p-4 div
        const p4 = el.querySelector('div.p-4');
        if(p4) p4.appendChild(btn);
      });
    }

    // PROFILES - admin delete + self-delete inside card
    document.querySelectorAll('div.group.bg-white.rounded-\[22px\]').forEach(el=>{
      if(el.querySelector('.__adminDelProfile') || el.querySelector('.__selfDelProfile')) return;
      const p4 = el.querySelector('div.p-4');
      if(!p4) return;
      // Try to get profile id by matching name
      const nameEl = el.querySelector('div.serif.text-\[22px\]');
      const name = nameEl ? nameEl.textContent.split('•')[0].trim() : '';

      // Admin delete
      if(isAdmin()){
        const btn = document.createElement('button');
        btn.className = '__adminDelProfile mt-2 mr-2 text-[11px] px-3 py-1 rounded-full bg-black text-white hover:bg-red-600';
        btn.textContent = 'Admin Delete';
        btn.onclick = async ()=>{
          if(!confirm(`Delete profile ${name} for everyone?`)) return;
          const client = await getClient();
          const {data} = await client.from('profiles').select('id,name').ilike('name', `%${name}%`).limit(3);
          const target = data && data[0];
          if(target){
            const {error} = await client.from('profiles').delete().eq('id', target.id);
            if(error) alert(error.message); else {el.remove(); alert('Profile deleted');}
          } else alert('Not found - delete from Table Editor');
        };
        p4.appendChild(btn);
      }

      // Self-delete - check if this is my profile
      try{
        const myId = localStorage.getItem('my_profile_id');
        // If we have myId, we need to check if this card is mine by fetching my profile
        // For now, show Delete My Profile if name matches my stored name or if myId exists and this is the only card with that name
        // Simpler: if localStorage has my_profile_id, show button on all cards but it will only delete if name matches my profile fetched
        const myName = localStorage.getItem('my_profile_name');
        // If no myName, we can still show a generic self-delete that prompts for confirmation and deletes my_profile_id
        if(myId){
          // Check if this card could be mine by seeing if its photo matches or by fetching
          // We'll add button that deletes my_profile_id regardless of card, but place it inside the card that matches myId if possible
          // For simplicity, add self-delete button to every card but only if myId exists - the button will delete myId
          const selfBtn = document.createElement('button');
          selfBtn.className = '__selfDelProfile mt-2 text-[11px] px-3 py-1 rounded-full border border-zinc-300 bg-white text-zinc-700 hover:border-black';
          selfBtn.textContent = 'Delete My Profile';
          selfBtn.onclick = async ()=>{
            if(!confirm('Delete YOUR profile permanently? You will need to create a new one.')) return;
            const client = await getClient();
            const {error} = await client.from('profiles').delete().eq('id', myId);
            if(error) alert('Failed: '+error.message);
            else {localStorage.removeItem('my_profile_id'); alert('Your profile deleted'); location.reload();}
          };
          // Only show this button if this card is likely mine - check if card contains myId in any attribute or if it's the first card and myId exists
          // We'll show it only on the card that matches my profile name if we have it, otherwise on first card
          // To avoid clutter, show on all cards but with logic to only delete myId - user will see it on their own card
          // Let's only show if this card's name matches the name we stored when creating profile
          const storedName = localStorage.getItem('my_profile_name');
          if(!storedName || name.toLowerCase().includes(storedName.toLowerCase()) || document.querySelectorAll('div.group.bg-white.rounded-\[22px\]').length===1){
            p4.appendChild(selfBtn);
          } else if (p4 && !p4.querySelector('.__selfDelProfile')){
            // For the very first card that is mine, we need to identify - we will add to first card as fallback if no name match
            // This will be handled by observer re-run
          }
        }
      }catch(e){}
    });
  }

  const _origCreate = window.localStorage;
  // Hook profile creation by observing alert "Profile added"
  const origAlert = window.alert;
  window.alert = function(msg){
    if(typeof msg === 'string' && msg.includes('Profile added')){
      try{
        // Try to get name from input field
        const nameInput = document.querySelector('input[placeholder*="Name"]') || document.querySelectorAll('input')[0];
        // We already store my_profile_id in base file via od patch, but we also store name
        const inputs = document.querySelectorAll('input');
        let nameVal = '';
        for(let inp of inputs){
          if(inp.value && inp.value.length>1 && inp.value.length<30){
            // Heuristic: first non-empty is name
            if(!nameVal) nameVal = inp.value;
          }
        }
        if(nameVal) localStorage.setItem('my_profile_name', nameVal);
      }catch(e){}
    }
    return origAlert.apply(this, arguments);
  };

  // Run observer every 2 seconds
  setInterval(addDeleteButtons, 2000);
  setTimeout(addDeleteButtons, 1500);

  console.log('✅ Safe admin-only delete + self-delete loaded');
})();
</script>

<div id="inbox-login" class="max-w-[380px] mx-auto border rounded-[20px] p-6">
<h2 class="font-bold text-[18px]">Inbox Login</h2><p class="text-[11px] text-zinc-500 mb-4">Use your profile name + password</p>
<input id="in-name" placeholder="Your Name" class="w-full h-11 rounded-[12px] border px-3 text-[14px] mb-3">

<div id="modal" class="fixed inset-0 z-50 hidden"><div id="modal-bg" class="absolute inset-0 bg-black/40"></div><div class="relative max-w-[520px] mx-auto mt-[8vh] bg-white dark:bg-zinc-900 rounded-[24px] border overflow-hidden">
<div class="p-5 border-b flex justify-between items-center"><div><h3 class="font-bold">Add Your Profile</h3><p class="text-[11px] text-zinc-500">Password for inbox. No WhatsApp for users.</p></div><button id="modal-close" class="h-8 w-8 rounded-full bg-zinc-100">✕</button></div>
<form id="add-form" class="p-5 space-y-3">
<div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] font-medium">Name *</label><input id="f-name" required class="mt-1 w-full h-11 rounded-[12px] border px-3 text-[14px]"></div><div><label class="text-[11px] font-medium">Age</label><input id="f-age" type="number" class="mt-1 w-full h-11 rounded-[12px] border px-3 text-[14px]"></div></div>
<div><label class="text-[11px] font-medium">Location</label><input id="f-location" class="mt-1 w-full h-11 rounded-[12px] border px-3 text-[14px]"></div>

<div><label class="text-[11px] font-medium">Photo</label><div class="mt-1 flex gap-2"><label class="h-11 px-4 rounded-[12px] border bg-zinc-50 flex items-center text-[12px] cursor-pointer"><input type="file" id="f-photo" accept="image/*" class="hidden">📷 Choose</label><span id="f-photo-name" class="text-[11px] text-zinc-500"></span></div><img id="f-preview" class="hidden mt-2 w-full max-h-[300px] object-contain rounded-[12px]"></div>
<button type="submit" id="f-submit" class="w-full h-12 rounded-full bg-black text-white font-semibold">Create Profile</button>
</form>
</div></div>

<script>
const Hv="https://tnraadzmmeqdbcpzyjwf.supabase.co";
const Ii="sb_publishable_ED87E0LOcR-LwOS3xy97gQ_wrd4DYAy";
async function Ie(table, opts={}){
  const method=opts.method||"GET";
  const query=opts._query||"";
  const headers={"apikey":Ii,"Authorization":"Bearer "+Ii,"Content-Type":"application/json",...(opts.headers||{})};
  const res=await fetch(Hv+"/rest/v1/"+table+query,{method,headers,body:opts.body});
  if(!res.ok){const t=await res.text(); throw new Error(t);}
  const txt=await res.text();
  try{return JSON.parse(txt);}catch{return txt;}
}
let profiles=[], livePosts=[], merch=[], myId=localStorage.getItem("my_profile_id"), role=localStorage.getItem("amor_role"), selectedChat=null, msgs=[];

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height,max=800;
      if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
      const c=document.createElement("canvas"); c.width=w;c.height=h;
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      c.toBlob(b=>{
        const r=new FileReader(); r.onload=()=>{res({blob:b,dataUrl:r.result}); URL.revokeObjectURL(url);}; r.readAsDataURL(b);
      },"image/jpeg",0.7);
    };
    img.onerror=()=>{URL.revokeObjectURL(url); rej();};
    img.src=url;
  });
}

async function loadAll(){
  try{const p=await Ie("profiles",{_query:"?select=*&order=created_at.desc"}); profiles=(Array.isArray(p)?p:[]).filter(x=>x.approved!==false);}catch(e){console.warn(e)}
  try{const l=await Ie("live_posts",{_query:"?select=*&order=created_at.desc&limit=50"}); livePosts=Array.isArray(l)?l:[];}catch(e){}
  try{const m=await Ie("merch",{_query:"?select=*&order=created_at.desc"}); merch=Array.isArray(m)?m:[];}catch(e){}
  renderDiscover(); renderLive(); renderMerch(); renderMy();
  if(myId) loadInbox();
}
function renderDiscover(){
  const g=document.getElementById("discover-grid");
  if(!profiles.length){g.innerHTML='<p class="col-span-3 text-center text-zinc-500 py-12 text-[13px]">No profiles yet</p>';return;}
  g.innerHTML=profiles.map(p=>{
    const photo=p.photo_url||"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=800&q=80";
    const isMe=p.id===myId;
    return `<div class="rounded-[22px] border bg-white dark:bg-zinc-900 overflow-hidden"><img src="${photo}" class="w-full h-[380px] object-cover"><div class="p-4"><div class="flex justify-between"><h3 class="font-bold">${p.name||""} ${p.age?`, ${p.age}`:""}</h3>${isMe?'<span class="text-[10px] px-2 py-1 rounded-full bg-black text-white">You</span>':""}</div>${p.location?`<p class="text-[11px] text-zinc-500 mt-1">${p.location}</p>`:""}${p.bio?`<p class="mt-2 text-[13px] line-clamp-3">${p.bio}</p>`:""}<div class="mt-3 flex gap-2">${!isMe?`<button onclick="startChat('${p.id}')" class="flex-1 h-9 rounded-full bg-black text-white text-[12px]">💬 Message</button>`:`<span class="text-[11px] text-zinc-400">Your profile</span>`}${role==='main'?`<button onclick="delProfile('${p.id}')" class="text-[11px] px-3 py-1 rounded-full bg-zinc-100">Delete</button>`:""}</div></div></div>`;
  }).join("");
}
function renderLive(){
  const f=document.getElementById("live-feed");
  if(!livePosts.length){f.innerHTML='<p class="text-center text-[13px] text-zinc-500 py-8">No posts yet</p>';return;}
  f.innerHTML=livePosts.map(p=>{
    const photo=p.photo_url||p.image_url||"";
    return `<div class="rounded-[20px] border bg-white dark:bg-zinc-900 overflow-hidden"><div class="p-4"><p class="text-[14px] whitespace-pre-wrap">${p.message||""}</p>${photo?`<img src="${photo}" class="mt-3 w-full max-h-[400px] object-contain rounded-[14px] bg-zinc-50">`:""}<div class="mt-3 flex justify-between"><span class="text-[11px] text-zinc-500">${p.user_name||""}</span>${role==='main'?`<button onclick="delLive('${p.id}')" class="text-[10px] px-3 py-1 rounded-full bg-black text-white">Delete</button>`:""}</div></div></div>`;
  }).join("");
}
function renderMerch(){
  const g=document.getElementById("merch-grid");
  const items=merch.length?merch:[{id:"m1",title:"GlobalAmor Tee",price:29,image_url:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80",description:"Premium",whatsapp:"+573001234567",vendor:"GlobalAmor Store"}];
  g.innerHTML=items.map(s=>{
    const img=s.image_url||s.photo_url||""; const wa=(s.whatsapp||"+573001234567").replace(/\D/g,""); const vendor=s.vendor||"GlobalAmor"; const msg=`Hi ${vendor} - I want ${s.title}`; const link=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
    return `<div class="rounded-[20px] border bg-white dark:bg-zinc-900 overflow-hidden">${img?`<img src="${img}" class="w-full h-[260px] object-cover">`:""}<div class="p-4"><h3 class="font-semibold text-[15px]">${s.title}</h3><p class="text-[12px] text-zinc-500 mt-1">${s.description||""}</p><p class="mt-2 font-bold">$${s.price||29}</p><a href="${link}" target="_blank" class="mt-3 flex h-11 items-center justify-center rounded-full bg-[#25D366] text-white font-bold text-[13px]">Buy via WhatsApp - Seller Only</a></div></div>`;
  }).join("");
}
function renderMy(){
  const b=document.getElementById("my-profile-box");
  if(!myId){b.innerHTML='<div class="border border-dashed rounded-[20px] p-8 text-center text-[13px] text-zinc-500">No profile yet. Add from Discover.</div>';return;}
  const p=profiles.find(x=>x.id===myId);
  if(!p){b.innerHTML=`<div class="border rounded-[20px] p-6 text-[12px]">ID ${myId} not found <button onclick="localStorage.removeItem('my_profile_id');location.reload()" class="underline">Clear</button></div>`;return;}
  b.innerHTML=`<div class="rounded-[22px] border bg-white dark:bg-zinc-900 overflow-hidden"><img src="${p.photo_url}" class="w-full h-[420px] object-cover"><div class="p-5"><h2 class="font-bold text-[20px]">${p.name}</h2><p class="text-[12px] text-zinc-500">${p.location||""}</p><p class="mt-3 text-[14px]">${p.bio||""}</p><div class="mt-4 flex gap-2"><button onclick="delProfile('${p.id}')" class="h-9 px-4 rounded-full bg-black text-white text-[12px]">Delete</button><button onclick="localStorage.removeItem('my_profile_id');location.reload()" class="h-9 px-4 rounded-full border text-[12px]">Logout</button></div></div></div>`;
}
// tabs
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active","bg-black","text-white"));
    btn.classList.add("active","bg-black","text-white");
    const t=btn.dataset.tab;
    document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));
    document.getElementById("view-"+t).classList.remove("hidden");
    if(t==="inbox"&&myId) loadInbox();
  });
});
// modal
document.getElementById("open-add").addEventListener("click",()=>document.getElementById("modal").classList.remove("hidden"));
document.getElementById("modal-close").addEventListener("click",()=>document.getElementById("modal").classList.add("hidden"));
document.getElementById("modal-bg").addEventListener("click",()=>document.getElementById("modal").classList.add("hidden"));
document.getElementById("f-photo").addEventListener("change",async e=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById("f-photo-name").textContent=file.name;
  const {dataUrl}=await compress(file);
  const img=document.getElementById("f-preview"); img.src=dataUrl; img.classList.remove("hidden"); img.dataset.url=dataUrl;
});
document.getElementById("live-file").addEventListener("change",async e=>{
  const file=e.target.files[0]; if(!file) return;
  const {dataUrl}=await compress(file);
  const img=document.getElementById("live-preview"); img.src=dataUrl; img.classList.remove("hidden"); img.dataset.url=dataUrl;
});
document.getElementById("add-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("f-submit"); btn.textContent="Creating..."; btn.disabled=true;
  try{
    let photoUrl=document.getElementById("f-preview").dataset.url||"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=800&q=80";
    const name=document.getElementById("f-name").value.trim();
    const age=parseInt(document.getElementById("f-age").value)||null;
    const location=document.getElementById("f-location").value.trim();
    const bio=document.getElementById("f-bio").value.trim();
    const password=document.getElementById("f-pass").value.trim();
    if(!name||!password) throw new Error("Name and password required");
    const {data,error} = await (async()=>{
      const res=await fetch(Hv+"/rest/v1/profiles?select=*",{method:"POST",headers:{"apikey":Ii,"Authorization":"Bearer "+Ii,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({name,age,location,bio,photo_url:photoUrl,password,approved:true,status:"approved"})});
      if(!res.ok) throw new Error(await res.text());
      const j=await res.json(); return {data:j[0]};
    })();
    myId=data.id; localStorage.setItem("my_profile_id",myId); profiles.unshift(data); renderDiscover(); renderMy();
    document.getElementById("modal").classList.add("hidden");
    document.querySelector('[data-tab="inbox"]').click();
  }catch(err){alert(err.message);}finally{btn.textContent="Create Profile"; btn.disabled=false;}
});
document.getElementById("live-post-btn").addEventListener("click",async()=>{
  const msg=document.getElementById("live-msg").value.trim();
  const photo=document.getElementById("live-preview").dataset.url||"";
  if(!msg&&!photo) return;
  try{
    const res=await fetch(Hv+"/rest/v1/live_posts?select=*",{method:"POST",headers:{"apikey":Ii,"Authorization":"Bearer "+Ii,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({message:msg,photo_url:photo,image_url:photo})});
    const j=await res.json(); livePosts.unshift(j[0]); document.getElementById("live-msg").value=""; document.getElementById("live-preview").classList.add("hidden"); renderLive();
  }catch(e){alert(e.message);}
});
// inbox
async function loadInbox(){
  if(!myId) return;
  document.getElementById("inbox-login").classList.add("hidden");
  document.getElementById("inbox-main").classList.remove("hidden");
  try{
    const data=await Ie("messages",{_query:`?or=(sender_id.eq.${myId},receiver_id.eq.${myId})&order=created_at.asc`});
    msgs=Array.isArray(data)?data:[]; renderConvs(); if(selectedChat) renderChat();
  }catch(e){console.warn(e);}
}
function renderConvs(){
  const list=document.getElementById("conv-list");
  const map={};
  msgs.forEach(m=>{const other=m.sender_id===myId?m.receiver_id:m.sender_id; if(!map[other]) map[other]=[]; map[other].push(m);});
  if(selectedChat&&!map[selectedChat]) map[selectedChat]=[];
  const entries=Object.entries(map);
  if(!entries.length){list.innerHTML='<p class="p-4 text-[11px] text-zinc-500">No chats yet. Go to Discover and click Message.</p>';return;}
  list.innerHTML=entries.map(([otherId,arr])=>{
    const p=profiles.find(x=>x.id===otherId); const name=p?p.name:otherId.slice(0,8); const last=arr[arr.length-1]; const unread=arr.filter(x=>x.receiver_id===myId&&!x.read).length;
    return `<button onclick="openChat('${otherId}')" class="w-full text-left p-3 flex gap-3 hover:bg-zinc-50 border-b ${selectedChat===otherId?'bg-zinc-100':''}"><img src="${p?.photo_url||''}" class="h-10 w-10 rounded-full bg-zinc-200 object-cover"><div class="flex-1 min-w-0"><div class="flex justify-between"><span class="font-medium text-[13px] truncate">${name}</span>${unread?`<span class="bg-red-500 text-white text-[10px] px-1.5 rounded-full">${unread}</span>`:""}</div><p class="text-[11px] text-zinc-500 truncate">${last?last.message:"No messages yet"}</p></div></button>`;
  }).join("");
}
function renderChat(){
  if(!selectedChat) return;
  const p=profiles.find(x=>x.id===selectedChat);
  document.getElementById("chat-head").textContent=p?p.name:selectedChat;
  const chat=document.getElementById("chat-msgs");
  const filtered=msgs.filter(m=>(m.sender_id===myId&&m.receiver_id===selectedChat)||(m.sender_id===selectedChat&&m.receiver_id===myId));
  chat.innerHTML=filtered.map(m=>{
    const isMe=m.sender_id===myId;
    return `<div class="flex ${isMe?'justify-end':''}"><div class="${isMe?'bg-black text-white':'bg-white border'} rounded-[16px] px-3 py-2 max-w-[75%] text-[13px]">${m.message}<div class="text-[10px] opacity-60 mt-1">${new Date(m.created_at).toLocaleTimeString()}</div></div></div>`;
  }).join("");
  chat.scrollTop=chat.scrollHeight;
}
window.startChat=function(id){
  if(!myId){alert("Create profile first!"); document.querySelector('[data-tab="inbox"]').click(); return;}
  if(id===myId) return;
  selectedChat=id; document.querySelector('[data-tab="inbox"]').click(); loadInbox();
};
window.openChat=function(id){selectedChat=id; renderConvs(); renderChat();};
async function sendMsg(){
  const input=document.getElementById("chat-input"); const txt=input.value.trim(); if(!txt||!selectedChat||!myId) return;
  try{
    const res=await fetch(Hv+"/rest/v1/messages?select=*",{method:"POST",headers:{"apikey":Ii,"Authorization":"Bearer "+Ii,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({sender_id:myId,receiver_id:selectedChat,message:txt})});
    const j=await res.json(); msgs.push(j[0]); input.value=""; renderConvs(); renderChat();
  }catch(e){alert(e.message);}
}
document.getElementById("chat-send").addEventListener("click",sendMsg);
document.getElementById("chat-input").addEventListener("keydown",e=>{if(e.key==="Enter") sendMsg();});
document.getElementById("in-login").addEventListener("click",async()=>{
  const name=document.getElementById("in-name").value.trim(); const pass=document.getElementById("in-pass").value.trim();
  if(!name||!pass){document.getElementById("in-err").textContent="Enter name and password"; document.getElementById("in-err").classList.remove("hidden"); return;}
  try{
    const data=await Ie("profiles",{_query:`?name=eq.${encodeURIComponent(name)}&password=eq.${encodeURIComponent(pass)}&select=*`});
    if(!data||!data.length) throw new Error("Invalid name or password");
    myId=data[0].id; localStorage.setItem("my_profile_id",myId); loadInbox();
  }catch(e){document.getElementById("in-err").textContent=e.message; document.getElementById("in-err").classList.remove("hidden");}
});

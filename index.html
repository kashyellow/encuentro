<script>
// SAFE MERCH FIX - paste before </body>
document.addEventListener('DOMContentLoaded',()=>{
  const merchSection = document.querySelector('[data-tab="merch"]') || document.body;
  if(document.getElementById('merchUploadBtn')) return;

  const btn = document.createElement('button');
  btn.id='merchUploadBtn';
  btn.innerHTML='📸 + Add New Merch';
  btn.style='background:#111;color:#fff;border-radius:999px;padding:12px 20px;border:none;font-weight:700;position:fixed;bottom:20px;right:20px;z-index:9999;cursor:pointer';
  document.body.appendChild(btn);

  btn.onclick=()=> {
    const title=prompt('Product Title:'); if(!title) return;
    const price=prompt('Price:');
    const input=document.createElement('input'); input.type='file'; input.accept='image/*';
    input.onchange=async(e)=>{
      const file=e.target.files[0];
      const reader=new FileReader();
      reader.onload=async(ev)=>{
        // compress
        const img=new Image(); img.src=ev.target.result;
        img.onload=async()=>{
          const canvas=document.createElement('canvas');
          let w=img.width,h=img.height; const max=1200;
          if(w>h){ if(w>max){h*=max/w; w=max}} else { if(h>max){w*=max/h; h=max}}
          canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const dataUrl=canvas.toDataURL('image/jpeg',0.82);

          // save - tries Supabase, falls back to localStorage so it WILL show
          try{
            if(window.supabase){
              const blob=await (await fetch(dataUrl)).blob();
              let url=dataUrl;
              try{
                const {data,error}=await window.supabase.storage.from('merch-images').upload(`merch/${Date.now()}.jpg`,blob);
                if(!error){ const {data:pub}=window.supabase.storage.from('merch-images').getPublicUrl(data.path); url=pub.publicUrl; }
              }catch{}
              await window.supabase.from('merch').insert([{title,price,image_url:url,created_at:new Date().toISOString()}]);
              alert('✅ Uploaded to Supabase!');
            }else{
              const local=JSON.parse(localStorage.getItem('globalamor_merch')||'[]');
              local.unshift({title,price,image_url:dataUrl,id:Date.now()});
              localStorage.setItem('globalamor_merch',JSON.stringify(local));
              alert('✅ Saved locally - will show after refresh');
            }
            location.reload();
          }catch(err){ alert('Failed: '+err.message+' but saved as base64 fallback'); }
        };
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };
});
</script>

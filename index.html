create extension if not exists "uuid-ossp";

-- PROFILES (linked to auth.users) with role + status + last_seen for Two Admins
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  name text not null,
  age int,
  city text,
  country text,
  country_code text,
  bio text,
  type text,
  photo text,
  verified boolean default false,
  role text default 'user' check (role in ('user','admin_main','admin_sub')),
  status text default 'pending' check (status in ('pending','approved','denied')),
  last_seen timestamptz default now(),
  email text,
  created_at timestamptz default now()
);
do $$ begin
  alter table public.profiles add column if not exists role text default 'user' check (role in ('user','admin_main','admin_sub'));
  alter table public.profiles add column if not exists status text default 'pending' check (status in ('pending','approved','denied'));
  alter table public.profiles add column if not exists last_seen timestamptz default now();
  alter table public.profiles add column if not exists email text;
exception when others then null; end $$;
alter table public.profiles enable row level security;
drop policy if exists "Public profiles readable" on public.profiles;
drop policy if exists "Users can insert own profile" on public.profiles;
drop policy if exists "Users can update own profile" on public.profiles;
drop policy if exists "Admins can update any profile" on public.profiles;
create policy "Public profiles readable" on public.profiles for select using (true);
create policy "Users can insert own profile" on public.profiles for insert with check (auth.uid() = id);
create policy "Users can update own profile" on public.profiles for update using (auth.uid() = id);
create policy "Admins can update any profile" on public.profiles for update using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.role in ('admin_main','admin_sub')));

-- POSTS
create table public.posts (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade,
  content text not null,
  image_url text,
  created_at timestamptz default now()
);
alter table public.posts enable row level security;
create policy "Posts are public" on public.posts for select using (true);
create policy "Authenticated can create posts" on public.posts for insert with check (auth.role() = 'authenticated');
create policy "Users can delete own posts" on public.posts for delete using (auth.uid() = user_id);

-- CONVERSATIONS
create table public.conversations (
  id uuid primary key default uuid_generate_v4(),
  created_at timestamptz default now(),
  last_message text,
  updated_at timestamptz default now()
);
alter table public.conversations enable row level security;
create policy "Participants can view conversations" on public.conversations for select using (exists (select 1 from public.conversation_participants where conversation_id = conversations.id and user_id = auth.uid()));
create policy "Authenticated can create conversations" on public.conversations for insert with check (auth.role() = 'authenticated');
create policy "Participants can update conversations" on public.conversations for update using (exists (select 1 from public.conversation_participants where conversation_id = conversations.id and user_id = auth.uid()));

-- PARTICIPANTS
create table public.conversation_participants (
  conversation_id uuid references public.conversations(id) on delete cascade,
  user_id uuid references auth.users(id) on delete cascade,
  created_at timestamptz default now(),
  primary key (conversation_id, user_id)
);
alter table public.conversation_participants enable row level security;
create policy "Users see own participations" on public.conversation_participants for select using (user_id = auth.uid());
create policy "Users can insert participants" on public.conversation_participants for insert with check (true);

-- MESSAGES
create table public.messages (
  id uuid primary key default uuid_generate_v4(),
  conversation_id uuid references public.conversations(id) on delete cascade,
  sender_id uuid references auth.users(id) on delete cascade,
  content text not null,
  created_at timestamptz default now()
);
alter table public.messages enable row level security;
create policy "Participants can read messages" on public.messages for select using (exists (select 1 from public.conversation_participants where conversation_id = messages.conversation_id and user_id = auth.uid()));
create policy "Participants can send messages" on public.messages for insert with check (exists (select 1 from public.conversation_participants where conversation_id = messages.conversation_id and user_id = auth.uid()));

-- REALTIME
alter publication supabase_realtime add table public.posts;
alter publication supabase_realtime add table public.messages;
alter publication supabase_realtime add table public.conversations;
alter publication supabase_realtime add table public.conversation_participants;

-- STORAGE: bucket post-images public
insert into storage.buckets (id, name, public) values ('post-images','post-images', true) on conflict (id) do nothing;

-- Storage policies
create policy "Public read post images" on storage.objects for select using (bucket_id = 'post-images');
create policy "Auth can upload post images" on storage.objects for insert with check (bucket_id = 'post-images' and auth.role() = 'authenticated');
create policy "Auth can update own images" on storage.objects for update using (bucket_id = 'post-images' and auth.role() = 'authenticated');

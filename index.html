-- Run this in Supabase SQL Editor

-- Profiles
create table if not exists profiles (
  id text primary key,
  name text not null,
  city text not null,
  age int not null check (age >= 18 and age <= 100),
  bio text not null,
  interests text,
  photo text,
  traveler_type text,
  verified boolean default false,
  trending_score int default 20,
  created_at timestamptz default now()
);

-- Wall Posts (expire after 7 days)
create table if not exists wall_posts (
  id text primary key,
  name text not null,
  city text not null,
  text text not null,
  image text,
  likes int default 0,
  created_at timestamptz default now(),
  expires_at timestamptz default (now() + interval '7 days')
);

-- Wall Comments
create table if not exists wall_comments (
  id text primary key,
  post_id text references wall_posts(id) on delete cascade,
  name text not null,
  text text not null,
  created_at timestamptz default now()
);

-- Storage bucket for photos
insert into storage.buckets (id, name, public)
values ('profile-photos', 'profile-photos', true)
on conflict (id) do nothing;

-- Enable RLS and permissive anon policies (tighten in production)
alter table profiles enable row level security;
alter table wall_posts enable row level security;
alter table wall_comments enable row level security;

drop policy if exists "public read" on profiles;
create policy "public read" on profiles for select using (true);
drop policy if exists "public insert" on profiles;
create policy "public insert" on profiles for insert with check (true);
drop policy if exists "public update" on profiles;
create policy "public update" on profiles for update using (true) with check (true);
drop policy if exists "public delete" on profiles;
create policy "public delete" on profiles for delete using (true);

drop policy if exists "public read" on wall_posts;
create policy "public read" on wall_posts for select using (true);
drop policy if exists "public insert" on wall_posts;
create policy "public insert" on wall_posts for insert with check (true);
drop policy if exists "public update" on wall_posts;
create policy "public update" on wall_posts for update using (true) with check (true);
drop policy if exists "public delete" on wall_posts;
create policy "public delete" on wall_posts for delete using (true);

drop policy if exists "public read" on wall_comments;
create policy "public read" on wall_comments for select using (true);
drop policy if exists "public insert" on wall_comments;
create policy "public insert" on wall_comments for insert with check (true);
drop policy if exists "public delete" on wall_comments;
create policy "public delete" on wall_comments for delete using (true);

-- Storage policies
drop policy if exists "public read storage" on storage.objects;
create policy "public read storage" on storage.objects for select using (bucket_id = 'profile-photos');
drop policy if exists "public upload storage" on storage.objects;
create policy "public upload storage" on storage.objects for insert with check (bucket_id = 'profile-photos');
drop policy if exists "public delete storage" on storage.objects;
create policy "public delete storage" on storage.objects for delete using (bucket_id = 'profile-photos');

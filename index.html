<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
body{background:#fff;color:#111;-webkit-text-size-adjust:100%}
#gate{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px;text-align:center}
#gate h1{font-size:36px;letter-spacing:1px;margin-bottom:8px} 
#gate button{background:#fff;color:#000;border:0;padding:16px 32px;border-radius:999px;font-weight:800;font-size:17px;cursor:pointer;margin-top:18px}
header{background:#000;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#f5f5f5;border-bottom:1px solid #ddd; -webkit-overflow-scrolling:touch}
nav button{border:1px solid #000;background:#fff;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;flex-shrink:0}
nav button.active{background:#000;color:#fff}
section{padding:16px;max-width:900px;margin:0 auto}
.card{border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:12px;background:#fff}
.card img{width:100%;border-radius:10px;max-height:320px;object-fit:cover}
.btn{width:100%;background:#000;color:#fff;border:0;padding:12px;border-radius:10px;margin-top:8px;cursor:pointer;font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px; -webkit-overflow-scrolling:touch}
.filters button{padding:6px 12px;border-radius:999px;border:1px solid #ccc;background:#fff;white-space:nowrap;flex-shrink:0}
.filters button.active{background:#000;color:#fff;border-color:#000}
#status{padding:8px 10px;border-radius:8px;margin-bottom:12px;font-size:12px;display:block;background:#d1e7dd;border:1px solid #a3cfbb}
</style>

<body>
<div id="gate">
  <h1>global amor</h1>
  <div style="opacity:.8;font-size:14px;margin:6px 0 4px">Travel • Connect • Belong</div>
  <div style="opacity:.5;font-size:11px">Community-owned • 18+ only</div>
  <button onclick="enterSite()">I am 18+ — Enter global amor</button>
</div>

<header><h1>Global Amor</h1><span style="font-size:11px;opacity:.7">Travel. Connect. Belong.</span></header>
<nav>
  <button id="tab-discover" class="active" onclick="showTab('discover')">Discover</button>
  <button id="tab-live" onclick="showTab('live')">Live</button>
  <button id="tab-merch" onclick="showTab('merch')">Community Merch</button>
  <button id="tab-wall" onclick="showTab('wall')">Wall</button>
  <button id="tab-admin" onclick="showTab('admin')">Admin</button>
</nav>

<section id="view-discover">
  <div id="status">Connecting...</div>
  <div class="filters" id="countryFilters"></div>
  <div id="profiles">Loading...</div>
</section>

<section id="view-live" style="display:none">
  <h2 style="font-size:20px">Live</h2>
  <div id="liveFeed" style="margin:12px 0">Loading...</div>
  <textarea id="liveText" placeholder="Post something to live feed..."></textarea>
  <button class="btn" onclick="postLive()">Post to Live</button>
</section>

<section id="view-merch" style="display:none"><h3>Community Merch</h3><div id="merchList">Coming soon</div></section>
<section id="view-wall" style="display:none"><h3>Wall</h3><div id="wallFeed">Loading...</div></section>

<section id="view-admin" style="display:none">
  <h3>Admin</h3>
  <p style="font-size:12px;color:#666;margin-bottom:8px">Only you can add profiles here. No public sign-up page.</p>
  <input id="adminPass" placeholder="Enter admin password" type="password"/>
  <button class="btn" onclick="adminLogin()">Unlock</button>
  <div id="adminPanel" style="display:none;margin-top:16px">
    <input id="pName" placeholder="Name (Ron)"/>
    <input id="pAge" placeholder="Age" type="number"/>
    <input id="pCountry" placeholder="Country (Colombia)"/>
    <input id="pCity" placeholder="City (Boston)"/>
    <textarea id="pBio" placeholder="Bio"></textarea>
    <input id="pPhoto" placeholder="Photo URL"/>
    <button class="btn" onclick="createProfile()">Add Profile - Goes Live Instantly</button>
    <hr style="margin:16px 0"/>
    <div id="allProfilesAdmin"></div>
  </div>
</section>

<script type="module">

let activeCountry='All';

function enterSite(){ localStorage.setItem('ga_entered','1'); document.getElementById('gate').style.display='none'; }
if(localStorage.getItem('ga_entered')==='1') document.getElementById('gate').style.display='none';
window.enterSite=enterSite;

function showStatus(t){ document.getElementById('status').textContent=t; }
function showTab(t){
  document.querySelectorAll('section').forEach(s=>s.style.display='none');
  document.getElementById('view-'+t).style.display='block';
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('tab-'+t); if(btn) btn.classList.add('active');
  if(t==='discover') loadProfiles(); if(t==='live') loadLive(); if(t==='wall') loadWall();
}
window.showTab=showTab;
window.filterCountry=(c)=>{ activeCountry=c; renderFilters(); loadProfiles(); };
function renderFilters(){ document.getElementById('countryFilters').innerHTML=COUNTRIES.map(x=>`<button class="${x===activeCountry?'active':''}" onclick="filterCountry('${x}')">${x}</button>`).join(''); }

async function loadProfiles(){
  const el=document.getElementById('profiles');
  try{
    const {data,error} = await supabaseClient.from('profiles').select('*').eq('status','approved').order('created_at',{ascending:false});
    if(error){ el.innerHTML='Error: '+error.message; showStatus(error.message); return; }
    let list=(activeCountry==='All'||activeCountry==='All Countries')?data:data.filter(p=>p.country===activeCountry);
    el.innerHTML=list.map(p=>`<div class="card">${p.photo?`<img src="${p.photo}" loading="lazy"/>`:''}<b>${p.name}</b> • ${p.country||''} ${p.city?','+p.city:''}<br/><small>${p.bio||''}</small></div>`).join('')||'<div class="card">No profiles yet. Add in Admin.</div>';
    showStatus(`global amor • ${data.length} profiles • Live on Supabase`);
  }catch(e){ el.innerHTML='Load failed: '+e.message+' - If Supabase paused, go to supabase.com and Resume project.'; showStatus('Load failed: '+e.message); }
}
async function loadLive(){ try{ const {data}=await supabaseClient.from('wall_posts').select('*').order('created_at',{ascending:false}).limit(30); document.getElementById('liveFeed').innerHTML=(data||[]).map(p=>`<div class="card">${p.text}<br/><small>${new Date(p.created_at).toLocaleString()}</small></div>`).join('')||'No live posts'; }catch(e){document.getElementById('liveFeed').innerHTML=e.message;} }
async function postLive(){ const t=document.getElementById('liveText').value.trim(); if(!t)return alert('Write something'); const {error}=await supabaseClient.from('wall_posts').insert({text:t}); if(error){alert(error.message);return;} document.getElementById('liveText').value=''; loadLive(); }
async function loadWall(){ try{ const {data}=await supabaseClient.from('wall_posts').select('*').order('created_at',{ascending:false}).limit(30); document.getElementById('wallFeed').innerHTML=(data||[]).map(p=>`<div class="card">${p.text}</div>`).join('')||'No wall posts'; }catch(e){} }
window.postLive=postLive;

async function adminLogin(){
  const pw=document.getElementById('adminPass').value.trim(); if(pw!=='kashyellow5844'){alert('Wrong password');return;}
  document.getElementById('adminPanel').style.display='block';
  const {data:all}=await supabaseClient.from('profiles').select('*').order('created_at',{ascending:false});
  document.getElementById('allProfilesAdmin').innerHTML=(all||[]).map(p=>`<div class="card"><b>${p.name}</b> (${p.status}) ${p.country}<br/><button class="btn" onclick="deleteProfile('${p.id}')" style="background:#c00">Delete</button></div>`).join('')||'No profiles';
}
window.adminLogin=adminLogin;
window.createProfile=async ()=>{
  const name=document.getElementById('pName').value.trim(); const ageStr=document.getElementById('pAge').value.trim(); const country=document.getElementById('pCountry').value.trim()||'Colombia'; const city=document.getElementById('pCity').value.trim()||'Boston'; const bio=document.getElementById('pBio').value.trim(); const photo=document.getElementById('pPhoto').value.trim();
  if(!name){alert('Name required');return;}
  const age=ageStr?parseInt(ageStr):null; const displayName=age?`${name}, ${age}`:name;
  const payload={name:displayName,country,city,bio,photo,status:'approved'}; if(age)payload.age=age;
  const {data,error}=await supabaseClient.from('profiles').insert(payload).select().single();
  if(error){alert(error.message);return;} alert('Added '+data.name+' - live now in Discover'); document.getElementById('pName').value=''; loadProfiles(); adminLogin();
};
window.deleteProfile=async (id)=>{ if(!confirm('Delete?'))return; await supabaseClient.from('profiles').delete().eq('id',id); adminLogin(); loadProfiles(); };

renderFilters(); loadProfiles(); loadLive(); loadWall();
</script>

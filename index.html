<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOBAL AMOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;padding:16px;max-width:600px;margin:0 auto}img{max-width:100%;border-radius:12px}.post{border:1px solid #ddd;padding:12px;border-radius:12px;margin:12px 0}</style>
</head>
<body>
<h2>Global Amor - Live</h2>
<input type="file" id="upload" accept="image/*"><br><br>
<input type="text" id="text" placeholder="Write something..." style="width:100%;padding:10px"><br><br>
<button onclick="savePost()" style="padding:12px;width:100%;background:black;color:white;border-radius:8px">Post Live For Everyone</button>
<hr>
<div id="feed">Loading...</div>
<script>
const SUPABASE_URL='https://tnraadzmmeqdbcpzyjwf.supabase.co'
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].N8QeAG3I08Sn-93Oqg0MCY9TUaehwND0kNjPHOBMu-o'
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
async function savePost(){
 const b=document.querySelector('button');b.innerText='Uploading...'
 const text=document.getElementById('text').value
 const file=document.getElementById('upload').files[0]
 let image_url=null
 if(file){
  const n=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.]/g,'')
  const {error}=await supabaseClient.storage.from('uploads').upload(n,file)
  if(error){alert(error.message);b.innerText='Post Live For Everyone';return}
  const {data}=supabaseClient.storage.from('uploads').getPublicUrl(n)
  image_url=data.publicUrl
 }
 const {error}=await supabaseClient.from('posts').insert([{text,image_url}])
 if(error){alert(error.message);b.innerText='Post Live For Everyone';return}
 document.getElementById('text').value='';document.getElementById('upload').value=''
 b.innerText='Post Live For Everyone';loadPosts()
}
async function loadPosts(){
 const {data}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false}).limit(50)
 document.getElementById('feed').innerHTML=(data||[]).map(p=>`<div class=post><p>${(p.text||'').replace(/</g,'&lt;')}</p>${p.image_url?`<img src="${p.image_url}">`:''}<br><small>${new Date(p.created_at).toLocaleString()}</small></div>`).join('')||'No posts yet - be first!'
}
loadPosts()
</script>
</body>
</html>

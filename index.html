-- Includes profiles.password and conversations.owner_id for private inbox

create table if not exists profiles (
  id text primary key,
  name text not null,
  age int,
  country text,
  city text,
  bio text,
  photo text,
  demo boolean default false,
  password text, -- inbox password (4+ chars)
  created_at timestamptz default now()
);
-- add password column if table existed
alter table profiles add column if not exists password text;

create table if not exists vendors (
  id text primary key,
  name text not null,
  owner text,
  created_at timestamptz default now()
);
create table if not exists merch (
  id text primary key,
  title text not null,
  price numeric,
  vendor_id text references vendors(id) on delete set null,
  image text,
  description text,
  created_at timestamptz default now()
);
create table if not exists wall_posts (
  id text primary key,
  author text,
  avatar text,
  text text,
  image text,
  likes int default 0,
  comments jsonb default '[]'::jsonb,
  time text,
  created_at timestamptz default now()
);
create table if not exists conversations (
  id text primary key,
  owner_id text, -- who started / owns this convo
  with_id text,
  with_name text,
  with_photo text,
  created_at timestamptz default now()
);
alter table conversations add column if not exists owner_id text;

create table if not exists messages (
  id text primary key,
  conversation_id text references conversations(id) on delete cascade,
  text text not null,
  sender text check (sender in ('me','them')) default 'me',
  created_at timestamptz default now()
);

-- RLS + open policies (demo)
alter table profiles enable row level security;
alter table vendors enable row level security;
alter table merch enable row level security;
alter table wall_posts enable row level security;
alter table conversations enable row level security;
alter table messages enable row level security;

drop policy if exists "open_all" on profiles;
drop policy if exists "open_all" on vendors;
drop policy if exists "open_all" on merch;
drop policy if exists "open_all" on wall_posts;
drop policy if exists "open_all" on conversations;
drop policy if exists "open_all" on messages;

create policy "open_all" on profiles for all using (true) with check (true);
create policy "open_all" on vendors for all using (true) with check (true);
create policy "open_all" on merch for all using (true) with check (true);
create policy "open_all" on wall_posts for all using (true) with check (true);
create policy "open_all" on conversations for all using (true) with check (true);
create policy "open_all" on messages for all using (true) with check (true);

function L(en, es){ return state.lang==="ES"?es:en; }
function toast(m){
  const el=document.getElementById("toast"); const t=document.getElementById("toastText");
  t.textContent=m; el.classList.remove("hidden"); setTimeout(()=>el.classList.add("hidden"),3000);
}

async function init(){
  if(!state.ageVerified){ renderAgeGate(); return; }
  renderApp();
  await fetchAll();
  setupRealtime();
}

async function fetchAll(){
  if(!supabaseClient) return;
  try{
    const {data:profiles} = await supabaseClient.from("profiles").select("*").order("created_at",{ascending:false});
    if(profiles && profiles.length){
      const remote = profiles.map(p=>({id:p.id, name:p.name, age:p.age, city:p.city, country:p.country, flag:p.flag||"🌍", photo_url:p.photo_url, bio:p.bio}));
      state.profiles = [...remote, ...DEFAULT_PROFILES];
    }
    const {data:live} = await supabaseClient.from("live_posts").select("*").order("created_at",{ascending:false});
    if(live) state.livePosts = live;
    const {data:merch} = await supabaseClient.from("merch_items").select("*").order("created_at",{ascending:false});
    if(merch) state.merch = merch;
    const {data:dms} = await supabaseClient.from("direct_messages").select("*").order("created_at",{ascending:true});
    if(dms) state.dms = dms;
    renderApp();
  }catch(e){ console.log(e); }
}

function setupRealtime(){
  if(!supabaseClient) return;
  supabaseClient.channel("global-amor")
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>fetchAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"live_posts"},()=>fetchAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"merch_items"},()=>fetchAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"direct_messages"},()=>fetchAll())
    .subscribe();
}

rc="${m.photo_url}" class="w-full h-[160px] object-cover"><div class="p-3"><div class="font-bold text-[14px]">${m.price||''}</div><div class="text-[12px] text-[#666] leading-[1.4]">${m.description||''}</div></div></div>`).join('')}</div></div>`;

] leading-[1.4] ${m.sender_id===state.userId?'bg-black text-white':'bg-white border border-[#eee] text-[#111]'}">${m.message}<div class="text-[9px] opacity-60 mt-1">${new Date(m.created_at).toLocaleTimeString()}</div></div></div>`).join('')}${msgs.length===0?`<div class="text-center text-[#aaa] text-[12px] py-10">No messages yet<br>Say hi! 👋<br>Stored in direct_messages table</div>`:''}</div><div class="p-3 border-t bg-white flex gap-2"><input value="${state.newMessage}" oninput="state.newMessage=this.value" onkeydown="if(event.key==='Enter')sendMessage()" placeholder="Message ${selected.name}..." class="flex-1 rounded-full border border-[#e5e5e5] px-4 py-2.5 text-[13px] outline-none focus:border-black"><button onclick="sendMessage()" class="px-5 py-2.5 rounded-full bg-black text-white font-bold text-[13px] hover:bg-zinc-800">Send</button></div></>`}</div></div></div></div>`;

function renderAdmin(){

gout()" class="w-full rounded-full border border-[#e5e5e5] py-2.5 text-[13px] font-bold hover:border-black">Logout & Reset Age Gate</button></div>`;
}

function getSQL(){ return `create extension if not exists pgcrypto;
create table if not exists profiles (id uuid primary key default gen_random_uuid(), name text not null, age int check (age>=18), city text, country text, flag text, photo_url text not null, bio text, owner_id text, created_at timestamptz default now());
alter table profiles enable row level security; drop policy if exists "Public read" on profiles; create policy "Public read" on profiles for select using (true); drop policy if exists "Public insert" on profiles; create policy "Public insert" on profiles for insert with check (true);
create table if not exists live_posts (id uuid primary key default gen_random_uuid(), name text, text text, photo_url text, likes int default 0, owner_id text, created_at timestamptz default now());
alter table live_posts enable row level security; drop policy if exists "Public read live" on live_posts; create policy "Public read live" on live_posts for select using (true); drop policy if exists "Public insert live" on live_posts; create policy "Public insert live" on live_posts for insert with check (true); drop policy if exists "Public update live" on live_posts; create policy "Public update live" on live_posts for update using (true);
create table if not exists merch_items (id uuid primary key default gen_random_uuid(), price text, stock text, description text, photo_url text, whatsapp text, owner_id text, created_at timestamptz default now());
alter table merch_items enable row level security; drop policy if exists "Public read merch" on merch_items; create policy "Public read merch" on merch_items for select using (true); drop policy if exists "Public insert merch" on merch_items; create policy "Public insert merch" on merch_items for insert with check (true);
create table if not exists direct_messages (id uuid primary key default gen_random_uuid(), sender_id text not null, sender_name text, receiver_id text not null, receiver_name text, message text not null, created_at timestamptz default now());
alter table direct_messages enable row level security; drop policy if exists "Public read dm" on direct_messages; create policy "Public read dm" on direct_messages for select using (true); drop policy if exists "Public insert dm" on direct_messages; create policy "Public insert dm" on direct_messages for insert with check (true);`; }

window.setLang = (l)=>{ state.lang=l; localStorage.setItem("ga-lang",l); state.ageVerified?renderApp():renderAgeGate(); };
window.toggleAge = ()=>{ state.ageChecked=!state.ageChecked; renderAgeGate(); };
window.toggleTerms = ()=>{ state.termsChecked=!state.termsChecked; renderAgeGate(); };
window.createAccount = ()=>{ const name=prompt("Your name for chats?")||"You"; state.userName=name; localStorage.setItem("ga-user-name",name); localStorage.setItem("ga_age_verified","true"); state.ageVerified=true; toast("Welcome ✓"); renderApp(); fetchAll(); };
window.switchTab = (id)=>{ state.tab=id; renderApp(); };
window.filterCountry = (c)=>{ state.filterCountry=c; renderApp(); };

window.toggleSQL = ()=>{ state.showSQL=!state.showSQL; renderApp(); };
window.closeModals = ()=>{ state.showHow=false; state.showSQL=false; renderApp(); };

window.updateNewProfile = (k,v)=>{ state.newProfile[k]=v; };
window.updateCountry = (val)=>{ const [flag,country]=val.split("|"); state.newProfile.flag=flag; state.newProfile.country=country; };
window.handlePhoto = (input,type)=>{
  const file=input.files?.[0]; if(!file) return;
  if(file.size>5242880){ toast("Max 5MB"); return; }
  const reader=new FileReader();
  reader.onload=()=>{ if(type==='profile'){ state.newProfile.photoFile=file; state.newProfile.photoPreview=reader.result; } if(type==='live'){ state.newLive.photoFile=file; state.newLive.photoPreview=reader.result; } if(type==='merch'){ state.newMerch.photoFile=file; state.newMerch.photoPreview=reader.result; } renderApp(); };
  reader.readAsDataURL(file);
};
window.submitProfile = async ()=>{
  const np=state.newProfile; if(!np.name||!np.age||parseInt(np.age)<18||!np.photoFile){ toast("Name, age 18+, photo required"); return; }
  toast("Publishing to Supabase post-images...");
  try{
    let url=np.photoPreview;
    if(supabaseClient){
      const ext=np.photoFile.name.split(".").pop(); const name=`${state.userId}-${Date.now()}.${ext}`;
      const {error} = await supabaseClient.storage.from("post-images").upload(name, np.photoFile, {upsert:true});
      if(error) throw error;
      const {data}=supabaseClient.storage.from("post-images").getPublicUrl(name); url=data.publicUrl;
    }
    if(supabaseClient){
      const {error}=await supabaseClient.from("profiles").insert({name:np.name, age:parseInt(np.age), city:np.city, country:np.country, flag:np.flag, photo_url:url, bio:np.bio, owner_id:state.userId});
      if(error) throw error;
    }
    state.newProfile={name:"", age:"", city:"", country:"USA", flag:"🇺🇸", photoFile:null, photoPreview:"", bio:""};
    toast("Profile live for everyone ✓"); state.tab="discover"; renderApp(); fetchAll();
  }catch(e){ console.error(e); toast("Failed - make buckets PUBLIC in Supabase Storage"); }
};
window.submitLive = async ()=>{
  const text=document.getElementById("liveText")?.value||""; if(!text && !state.newLive.photoFile){ toast("Add text or photo"); return; }
  try{
    let url=null; if(state.newLive.photoFile && supabaseClient){ const ext=state.newLive.photoFile.name.split(".").pop(); const name=`${state.userId}-${Date.now()}.${ext}`; await supabaseClient.storage.from("live_photos").upload(name, state.newLive.photoFile, {upsert:true}); const {data}=supabaseClient.storage.from("live_photos").getPublicUrl(name); url=data.publicUrl; } else if(state.newLive.photoPreview) url=state.newLive.photoPreview;
    if(supabaseClient) await supabaseClient.from("live_posts").insert({name:state.userName, text, photo_url:url, owner_id:state.userId});
    state.newLive={text:"", photoFile:null, photoPreview:""}; toast("Posted for everyone ✓"); renderApp(); fetchAll();
  }catch(e){ console.error(e); toast("Failed - check live_photos bucket PUBLIC"); }
};
window.submitMerch = async ()=>{
  const price=document.getElementById("mPrice")?.value; if(!price){ toast("Price required"); return; }
  const stock=document.getElementById("mStock")?.value; const desc=document.getElementById("mDesc")?.value; const wa=document.getElementById("mWA")?.value;
  try{
    let url=null; if(state.newMerch.photoFile && supabaseClient){ const ext=state.newMerch.photoFile.name.split(".").pop(); const name=`${state.userId}-${Date.now()}.${ext}`; await supabaseClient.storage.from("uploads").upload(name, state.newMerch.photoFile, {upsert:true}); const {data}=supabaseClient.storage.from("uploads").getPublicUrl(name); url=data.publicUrl; } else if(state.newMerch.photoPreview) url=state.newMerch.photoPreview;
    if(supabaseClient) await supabaseClient.from("merch_items").insert({price, stock, description:desc, photo_url:url, whatsapp:wa, owner_id:state.userId});
    toast("Product live for everyone ✓"); renderApp(); fetchAll();
  }catch(e){ console.error(e); toast("Failed - check uploads bucket PUBLIC"); }
};
window.selectChat = (id,name)=>{ state.selectedChat={id,name}; state.newMessage=""; renderApp(); setTimeout(()=>{ const el=document.getElementById("chatScroll"); if(el) el.scrollTop=el.scrollHeight; },100); };
window.startChat = (id,name)=>{ state.tab="chats"; state.selectedChat={id,name}; renderApp(); };
window.sendMessage = async ()=>{
  const msg=state.newMessage.trim(); if(!msg||!state.selectedChat) return;
  state.newMessage=""; renderApp();
  try{ if(supabaseClient) await supabaseClient.from("direct_messages").insert({sender_id:state.userId, sender_name:state.userName, receiver_id:state.selectedChat.id, receiver_name:state.selectedChat.name, message:msg}); fetchAll(); }catch(e){ console.error(e); toast("Message failed"); }
};
window.logout = ()=>{ localStorage.removeItem("ga_age_verified"); state.ageVerified=false; renderAgeGate(); };
window.fetchAll = fetchAll;

init();
</script>

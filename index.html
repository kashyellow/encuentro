<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlobalAmor — minimal</title>
<style>
:root{--navy:#08233f;--pink:#ff2878;--bg:#f5f7fb;--card:#fff;--ink:#132034;--muted:#7a8aa0;--line:#e6ebf2;--green:#13a86a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(255,255,255,.06)}
.bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#ff7eb3);display:grid;place-items:center;font-size:16px}
.brand strong{font-size:15px;letter-spacing:-.2px}.brand strong span{color:#ff4d8e}
.nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{background:rgba(255,255,255,.09);color:#c8d6e6;border:0;border-radius:999px;padding:6px 11px;font-weight:600;font-size:12.5px;flex-shrink:0;transition:.15s}
.nav button.active{background:#fff;color:var(--navy)}
.nav button:hover{background:rgba(255,255,255,.16)}
.actions{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto}
.pill{border-radius:999px;padding:6px 12px;font-weight:700;border:0;font-size:12.5px}
.pill-pink{background:var(--pink);color:#fff}.pill-white{background:#fff;color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:16px 12px 80px;display:block}
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.body{padding:10px}
.online{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.2px}.name{font-size:14px;font-weight:700;margin-top:2px}.muted{font-size:12px;color:var(--muted)}.desc{font-size:12px;line-height:1.35;color:#5a6a80;margin-top:4px;min-height:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardrow{display:flex;gap:6px;margin-top:8px}.small{flex:1;padding:6px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600;font-size:12px}.small.pink{background:var(--pink);color:#fff;border:0}
.feedlayout{display:grid;grid-template-columns:1fr 260px;gap:16px}
.composer textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fafc;resize:vertical;font-size:13px;outline:none}
.composer textarea:focus{background:#fff;border-color:#cbd5e1}
.post{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:#fff}
.postimg{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-top:8px;display:block}
.chat{display:grid;grid-template-columns:240px 1fr;min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.chatlist{background:#f8fafc;border-right:1px solid var(--line);overflow-y:auto}
.person{display:flex;gap:8px;padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}.person.active{background:#fff}
.bubbles{flex:1;padding:14px;overflow-y:auto;max-height:460px}
.bubble{max-width:76%;padding:8px 11px;border-radius:12px;background:#eef2f7;margin:6px 0;font-size:13px;line-height:1.35}.bubble.me{margin-left:auto;background:#ffe3ed}
.bubble-actions{font-size:10.5px;color:var(--muted);display:flex;gap:8px;margin-top:4px}.bubble-actions span{cursor:pointer;text-decoration:underline}
.chatinput{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);align-items:center}
.chatinput input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;background:#f8fafc}
.primary{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}.outline{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:12.5px}
.link{background:transparent;border:0;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;padding:4px}
.modal{position:fixed;inset:0;background:rgba(8,35,63,.55);display:none;place-items:center;z-index:100;padding:14px}.modal.show{display:grid}.modal-card{background:#fff;border-radius:16px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;border:1px solid var(--line)}
.gate{position:fixed;inset:0;background:var(--navy);z-index:200;display:grid;place-items:center;padding:16px;color:#fff}.gate-card{background:#fff;color:var(--ink);border-radius:18px;padding:22px;max-width:380px;width:100%;text-align:center}
.img-grid{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.img-preview{width:64px;height:64px;border-radius:8px;object-fit:cover}.img-wrap{position:relative}.img-wrap button{position:absolute;top:-5px;right:-5px;background:var(--pink);color:#fff;border:0;border-radius:50%;width:18px;height:18px;font-size:12px}
.search{width:100%;max-width:360px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;outline:none}
.tiny{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.online-card{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;font-size:13px;padding:6px 0}

<body>
<div id="ageGate" class="gate">
  <div class="gate-card">
    <div style="font-size:28px">\uD83C\uDF0E</div>
    <h2 style="margin:8px 0 4px;font-size:18px">18+ only</h2>
    <p class="muted" style="font-size:12.5px">GlobalAmor is for adults. Confirm to continue.</p>
    <label style="display:flex;gap:8px;text-align:left;margin:14px 0;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid var(--line)"><input type="checkbox" id="ageCheck"><span style="font-size:12px">I'm 18+ and agree to community guidelines</span></label>
    <button id="enterBtn" class="primary" style="width:100%;opacity:.5" disabled>Enter</button>
    <button onclick="location.href='https://google.com'" class="outline" style="width:100%;margin-top:6px">Exit</button>
  </div>
</div>

<header>
  <div class="bar">
    <div class="brand"><div class="logo">\uD83D\uDC95</div><strong>Global<span>Amor</span></strong></div>
    <nav class="nav" id="topNav">
      <button class="active" data-page="discover" onclick="go('discover')">\uD83D\uDD0E Discover</button>
      <button data-page="feed" onclick="go('feed')">\uD83C\uDF0E Feed</button>
      <button data-page="messages" onclick="go('messages')">\uD83D\uDCAC Messages</button>
      <button data-page="merch" onclick="go('merch')">\uD83D\uDECD️ Merch</button>
      <button data-page="events" onclick="go('events')">\uD83D\uDCC5 Events</button>
      <button data-page="account" onclick="go('account')">⚙️ Account</button>
      <button data-page="admin" onclick="go('admin')">\uD83D\uDEE1️ Admin</button>
    </nav>
    <div class="actions">
      <button id="createProfileBtn" class="pill pill-pink" onclick="openProfileModal()">Create</button>
      <img id="headerAvatar" class="hidden" style="width:28px;height:28px;border-radius:50%;object-fit:cover">
      <button id="authBtn" class="pill pill-white" onclick="openAuthModal()">Sign in</button>
    </div>
  </div>
</header>

<main>
  <div id="discover" class="view">
    <div class="section" style="padding:12px">
      <input id="search" class="search" placeholder="Search people, country, interests…" oninput="renderPeople()">
    </div>
    <div id="people" class="grid"></div>
  </div>

  <div id="feed" class="view hidden">
    <div class="feedlayout">
      <div>
        <div class="section composer">
          <textarea id="postText" placeholder="Share something... (create profile first)"></textarea>
          <div id="postPreview" class="img-grid"></div>
          <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
            <input type="file" id="postFile" multiple accept="image/*" class="hidden" onchange="handlePostFiles(event)">
            <button class="outline" onclick="document.getElementById('postFile').click()">Add photos</button>
            <div style="margin-left:auto"><button class="primary" onclick="addPost()">Post</button></div>
          </div>
          <div id="feedList"></div>
        </div>
      </div>
      <div class="section" style="padding:12px">
        <div class="tiny" style="margin-bottom:8px">Online now</div>
        <div id="onlineList"></div>
      </div>
    </div>
  </div>

  <div id="messages" class="view hidden">
    <div class="section" style="padding:0;overflow:hidden">
      <div class="chat">
        <div class="chatlist" id="chatList"></div>
        <div style="display:flex;flex-direction:column;flex:1;min-width:0">
          <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px"><b id="chatName" style="font-size:13px">Select a conversation</b></div>
          <div id="bubbles" class="bubbles"></div>
          <div class="chatinput">
            <input type="file" id="msgFile" multiple accept="image/*" class="hidden" onchange="handleMsgFiles(event)">
            <button class="outline" onclick="document.getElementById('msgFile').click()">\uD83D\uDCF7</button>
            <input id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="primary" onclick="sendMessage()">Send</button>
          </div>
          <div id="msgPreview" class="img-grid" style="padding:0 10px 10px"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="merch" class="view hidden">
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="tiny">Merch</div>
        <button class="link" onclick="alert('Seller form coming soon')">+ Sell item</button>
      </div>
      <div id="products" class="grid"></div>
    </div>
  </div>

  <div id="events" class="view hidden">
    <div class="section">
      <div class="tiny" style="margin-bottom:10px">Events</div>
      <div id="eventsGrid" class="grid"></div>
    </div>
  </div>

  <div id="account" class="view hidden">
    <div class="section" id="accountContent"><p class="muted" style="font-size:13px">Create a profile to see your account.</p><button class="primary" onclick="openProfileModal()">Create Profile</button></div>
    <div class="section">
      <div class="tiny">My uploads</div>
      <div id="myUploads" class="muted" style="font-size:13px;margin-top:6px">—</div>

  </div>

  <div id="admin" class="view hidden">
    <div class="section">
      <div class="tiny" style="margin-bottom:8px">Supabase • https://tnraadzmmeqdbcpzyjwf.supabase.co</div>
      <div id="supabaseStatus" class="muted" style="font-size:12px;margin-bottom:10px">Checking…</div>
      <div id="tableCounts" class="muted" style="font-size:12px;margin-bottom:10px"></div>
      <details>
        <summary>SQL schema & RLS (collapsed)</summary>
        <textarea style="width:100%;height:220px;font-family:ui-monospace,monospace;font-size:11px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px" readonly>create extension if not exists "uuid-ossp";
create table if not exists profiles (id uuid primary key references auth.users(id) on delete cascade, email text, display_name text, age int check (age>=18), country text, bio text, avatar_url text, interests text[], languages text[], created_at timestamp default now(), updated_at timestamp default now());
create table if not exists posts (id uuid primary key default uuid_generate_v4(), user_id uuid references profiles(id) on delete cascade, content text, images text[], likes int default 0, created_at timestamp default now(), updated_at timestamp default now());
create table if not exists conversations (id uuid primary key default uuid_generate_v4(), participant1 uuid references profiles(id), participant2 uuid references profiles(id), last_message text, last_message_at timestamp default now(), created_at timestamp default now(), unique(participant1, participant2));
create table if not exists messages (id uuid primary key default uuid_generate_v4(), conversation_id uuid references conversations(id) on delete cascade, sender_id uuid references profiles(id) on delete cascade, content text, images text[], created_at timestamp default now(), edited boolean default false);
insert into storage.buckets (id,name,public) values ('avatars','avatars',true) on conflict do nothing;
insert into storage.buckets (id,name,public) values ('post-images','post-images',true) on conflict do nothing;
alter table profiles enable row level security; alter table posts enable row level security; alter table conversations enable row level security; alter table messages enable row level security;
drop policy if exists "public all profiles" on profiles; create policy "public all profiles" on profiles for all using (true) with check (true);
drop policy if exists "public all posts" on posts; create policy "public all posts" on posts for all using (true) with check (true);
drop policy if exists "public all convos" on conversations; create policy "public all convos" on conversations for all using (true) with check (true);
drop policy if exists "public all messages" on messages; create policy "public all messages" on messages for all using (true) with check (true);
drop policy if exists "public read" on storage.objects; create policy "public read" on storage.objects for select using (bucket_id in ('avatars','post-images'));
drop policy if exists "public write" on storage.objects; create policy "public write" on storage.objects for insert with check (bucket_id in ('avatars','post-images'));
drop policy if exists "public update" on storage.objects; create policy "public update" on storage.objects for update using (bucket_id in ('avatars','post-images'));
drop policy if exists "public delete" on storage.objects; create policy "public delete" on storage.objects for delete using (bucket_id in ('avatars','post-images'));</textarea>
      </details>
    </div>
  </div>

  <div id="profile" class="view hidden"><div class="section" id="profileDetail"></div></div>
</main>

<div id="authModal" class="modal"><div class="modal-card"><h3 style="margin:0 0 8px">Sign in</h3><input id="authEmail" placeholder="Email" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px"><input id="authPass" type="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px"><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" style="flex:1" onclick="signUp()">Sign up</button><button class="outline" style="flex:1" onclick="signIn()">Sign in</button></div><button class="outline" style="width:100%;margin-top:8px" onclick="continueGuest()">Continue as guest</button><p id="authMsg" class="muted" style="font-size:12px;margin-top:8px"></p><button class="link" style="width:100%;margin-top:8px" onclick="closeModal('authModal')">Close</button></div></div>

<div id="profileModal" class="modal"><div class="modal-card"><h3 id="profileModalTitle" style="margin:0 0 10px">Create Profile</h3><input id="pName" placeholder="Display name" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px"><input id="pAge" type="number" placeholder="Age 18+" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px"><input id="pCountry" placeholder="Country" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px"><textarea id="pBio" placeholder="Bio" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;min-height:60px"></textarea><input id="pInterests" placeholder="Interests, comma separated" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px"><input type="file" id="pAvatar" accept="image/*" style="margin-top:10px;font-size:12px"><div id="avatarPreview" class="img-grid"></div><button class="primary" style="width:100%;margin-top:10px" onclick="saveProfile()">Save</button><button class="outline" style="width:100%;margin-top:6px" onclick="closeModal('profileModal')">Cancel</button><p id="profileMsg" class="muted" style="font-size:12px"></p></div></div>

<div id="editPostModal" class="modal"><div class="modal-card"><h3 style="margin:0 0 10px">Edit post</h3><textarea id="editPostText" style="width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:13px"></textarea><div id="editPostPreview" class="img-grid"></div><input type="file" id="editPostFile" multiple accept="image/*" class="hidden" onchange="handleEditPostFiles(event)"><button class="outline" style="margin-top:8px" onclick="document.getElementById('editPostFile').click()">Add / remove photos</button><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" style="flex:1" onclick="saveEditedPost()">Save</button><button class="outline" style="flex:1" onclick="closeModal('editPostModal')">Cancel</button></div></div></div>

<script>
const SUPABASE_URL='https://tnraadzmmeqdbcpzyjwf.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucmFhZHptbWVxZGJjcHp5andmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.N8QeAG3I08Sn-93Oqg0MCY9TUaehwND0kNjPHOBMu-o';
let supabaseClient=null;
try{
  if(typeof supabase!=='undefined' && supabase.createClient){ supabaseClient=supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }
}catch(e){ console.warn('supabase offline', e); }
if(!supabaseClient){
  // offline stub to avoid crashes in validator/preview without network
  const stub = { from:()=>({select:()=>({eq:()=>({single:()=>Promise.resolve({data:null})}), limit:()=>Promise.resolve({data:[]}), order:()=>({limit:()=>Promise.resolve({data:[]})})}), order:()=>({limit:()=>Promise.resolve({data:[]})}), limit:()=>Promise.resolve({data:[]}), insert:()=>({select:()=>({single:()=>Promise.resolve({data:null, error:{message:'offline'}})})}), upsert:()=>Promise.resolve({error:null}), update:()=>({eq:()=>Promise.resolve({error:null})}), delete:()=>({eq:()=>Promise.resolve({error:null})}), or:()=>({order:()=>Promise.resolve({data:[]})})}), storage:{from:()=>({upload:()=>Promise.resolve({error:{message:'offline'}}), getPublicUrl:()=>({data:{publicUrl:''}})})}, auth:{getSession:()=>Promise.resolve({data:{session:null}}), signUp:()=>Promise.resolve({error:{message:'offline'}}), signInWithPassword:()=>Promise.resolve({error:{message:'offline'}}), signOut:()=>Promise.resolve({})}, channel:()=>({on:()=>({subscribe:()=>{}})}), };
  supabaseClient=stub;
}
let currentUser=null;
let peopleData=[["Valentina",28,"Colombia","\uD83C\uDDE8\uD83C\uDDF4","Travel, coffee, good food.","https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=85"],["Carlos",32,"Spain","\uD83C\uDDEA\uD83C\uDDF8","Adventure, hiking.","https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=700&q=85"],["Sofia",24,"Mexico","\uD83C\uDDF2\uD83C\uDDFD","Music, travel.","https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85"],["Isabella",25,"Colombia","\uD83C\uDDE8\uD83C\uDDF4","Beach soul, sunsets.","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=85"],["Maya",26,"Peru","\uD83C\uDDF5\uD83C\uDDEA","Food & markets.","https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=700&q=85"],["Diego",30,"Argentina","\uD83C\uDDE6\uD83C\uDDF7","Photography.","https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=85"]];
let postsData=[]; let conversations=[]; let messagesData={}; let currentChatId=null; let pendingPostFiles=[]; let pendingMsgFiles=[]; let pendingAvatarFile=null; let pendingEditFiles=[]; let editingPost=null;

const gate=document.getElementById('ageGate');
if(localStorage.getItem('globalamor_age_verified')==='true') gate.classList.add('hidden');
document.getElementById('ageCheck').onchange=e=>{let b=document.getElementById('enterBtn'); b.disabled=!e.target.checked; b.style.opacity=e.target.checked?'1':'.5';};
document.getElementById('enterBtn').onclick=()=>{localStorage.setItem('globalamor_age_verified','true'); gate.classList.add('hidden');};

function go(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  let el=document.getElementById(id); if(el) el.classList.remove('hidden');
  document.querySelectorAll('#topNav button').forEach(b=>b.classList.remove('active'));
  let btn=document.querySelector('#topNav button[data-page="'+id+'"]'); if(btn) btn.classList.add('active');
  window.scrollTo(0,0);
}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openAuthModal(){openModal('authModal')}
function openProfileModal(){
  document.getElementById('profileModalTitle').textContent=currentUser?.profile?'Edit Profile':'Create Profile';
  if(currentUser?.profile){pName.value=currentUser.profile.display_name||'';pAge.value=currentUser.profile.age||'';pCountry.value=currentUser.profile.country||'';pBio.value=currentUser.profile.bio||'';pInterests.value=(currentUser.profile.interests||[]).join(', ');}
  openModal('profileModal')
}
async function checkAuth(){let {data:{session}} = await supabaseClient.auth.getSession(); if(session?.user){currentUser={id:session.user.id, email:session.user.email}; await loadProfile(); document.getElementById('authBtn').textContent='Sign out'; document.getElementById('authBtn').onclick=signOut;} else {document.getElementById('authBtn').textContent='Sign in'; document.getElementById('authBtn').onclick=openAuthModal;} updateHeader(); loadPosts(); loadConversations(); checkSupabase();}
async function signUp(){let email=authEmail.value.trim(), pass=authPass.value.trim(); if(!email||!pass) return authMsg.textContent='Enter email & password'; let {error}=await supabaseClient.auth.signUp({email,password:pass}); authMsg.textContent=error?error.message:'Check email then sign in';}
async function signIn(){let email=authEmail.value.trim(), pass=authPass.value.trim(); let {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass}); if(error){authMsg.textContent=error.message; return;} closeModal('authModal'); checkAuth();}
async function signOut(){await supabaseClient.auth.signOut(); currentUser=null; updateHeader(); document.getElementById('authBtn').textContent='Sign in'; document.getElementById('authBtn').onclick=openAuthModal;}
function continueGuest(){currentUser={id:'guest-'+Date.now(), email:'guest', guest:true, profile:{display_name:'Guest', avatar_url:'https://ui-avatars.com/api/?name=Guest'}}; updateHeader(); closeModal('authModal');}
async function loadProfile(){if(!currentUser||currentUser.guest) return; let {data}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single(); if(data) currentUser.profile=data;}
function updateHeader(){
  let btn=document.getElementById('createProfileBtn'), av=document.getElementById('headerAvatar');
  if(currentUser?.profile?.avatar_url){av.src=currentUser.profile.avatar_url; av.classList.remove('hidden'); btn.textContent='Edit';}
  else if(currentUser?.guest){av.src=currentUser.profile.avatar_url; av.classList.remove('hidden'); btn.textContent='Edit';}
  else {av.classList.add('hidden'); btn.textContent='Create';}
  let acc=document.getElementById('accountContent');
  if(currentUser?.profile){
    acc.innerHTML='<div style="display:flex;gap:12px"><img src="'+(currentUser.profile.avatar_url||'')+'" style="width:64px;height:64px;border-radius:50%;object-fit:cover"><div><div style="font-weight:700">'+currentUser.profile.display_name+'</div><div class="muted" style="font-size:12px">'+(currentUser.profile.country||'')+' • '+(currentUser.profile.age||'')+'</div><div style="font-size:13px;margin-top:6px">'+(currentUser.profile.bio||'')+'</div></div></div><button class="primary" onclick="openProfileModal()" style="margin-top:10px">Edit profile</button>';
  }
}
document.getElementById('pAvatar').addEventListener('change', e=>{pendingAvatarFile=e.target.files[0]; let prev=document.getElementById('avatarPreview'); prev.innerHTML=''; if(pendingAvatarFile){let img=document.createElement('img'); img.className='img-preview'; img.src=URL.createObjectURL(pendingAvatarFile); prev.appendChild(img);}});
async function saveProfile(){let name=pName.value.trim(), age=parseInt(pAge.value), country=pCountry.value.trim(), bio=pBio.value.trim(), interests=pInterests.value.split(',').map(s=>s.trim()).filter(Boolean); if(!name||!age||age<18){profileMsg.textContent='Name and 18+ required'; return;} if(!currentUser){profileMsg.textContent='Sign in first'; return;} let avatarUrl=currentUser.profile?.avatar_url||null; if(pendingAvatarFile){let fileName=currentUser.id+'/'+Date.now()+'_'+pendingAvatarFile.name; let {error}=await supabaseClient.storage.from('avatars').upload(fileName, pendingAvatarFile, {upsert:true}); if(!error){let {data:pub}=supabaseClient.storage.from('avatars').getPublicUrl(fileName); avatarUrl=pub.publicUrl;} else avatarUrl=URL.createObjectURL(pendingAvatarFile);} let profile={id:currentUser.id, email:currentUser.email, display_name:name, age, country, bio, interests, avatar_url:avatarUrl, updated_at:new Date().toISOString()}; if(currentUser.guest){currentUser.profile=profile; updateHeader(); closeModal('profileModal'); return;} let {error}=await supabaseClient.from('profiles').upsert(profile); if(error){profileMsg.textContent=error.message; return;} currentUser.profile=profile; updateHeader(); closeModal('profileModal');}

function renderPeople(){
  let q=document.getElementById('search').value.toLowerCase();
  let base=peopleData.filter(p=>p.join(' ').toLowerCase().includes(q)).map((p,i)=>'<article class="card"><img class="photo" src="'+p[5]+'"><div class="body"><div class="online">● Online</div><div class="name">'+p[0]+', '+p[1]+'</div><div class="muted">'+p[3]+' '+p[2]+'</div><div class="desc">'+p[4]+'</div><div class="cardrow"><button class="small" onclick="showProfile('+i+')">View</button><button class="small pink" onclick="startChat(\\''+p[0]+'\\')">Msg</button></div></div></article>').join('');
  let remote=(window.remoteProfiles||[]).filter(p=>(p.display_name+' '+(p.country||'')).toLowerCase().includes(q)).map(p=>'<article class="card"><img class="photo" src="'+(p.avatar_url||'')+'"><div class="body"><div class="name">'+p.display_name+'</div><div class="muted">'+(p.country||'')+'</div><div class="cardrow"><button class="small pink" onclick="startChatById(\\''+p.id+'\\',\\''+p.display_name+'\\')">Msg</button></div></div></article>').join('');
  document.getElementById('people').innerHTML=base+remote;
  let on=document.getElementById('onlineList'); on.innerHTML=peopleData.slice(0,6).map(p=>'<div class="online-card"><img src="'+p[5]+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover"><div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p[0]+'</div><div class="muted" style="font-size:11px">● online</div></div><button class="small" style="padding:4px 8px" onclick="startChat(\\''+p[0]+'\\')">Msg</button></div>').join('');
}
function showProfile(i){let p=peopleData[i]; document.getElementById('profileDetail').innerHTML='<button class="outline" onclick="go(\\'discover\\')">← Back</button><div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap"><img src="'+p[5]+'" style="width:220px;border-radius:14px"><div><h3 style="margin:0">'+p[0]+', '+p[1]+'</h3><p class="muted" style="font-size:12px">'+p[3]+' '+p[2]+'</p><p style="font-size:13px;margin-top:8px">'+p[4]+'</p><button class="primary" onclick="startChat(\\''+p[0]+'\\')">Message</button></div></div>'; go('profile');}
function handlePostFiles(e){pendingPostFiles=[...pendingPostFiles, ...Array.from(e.target.files)]; renderPostPreview();}

to these Terms; (3) You are not prohibited by law from using an online dating service; (4) The information you provide regarding your age is truthful and accurate; and (5) You will not allow a person under 18 to access or use your account. If we discover or reasonably believe that an individual is under 18, we may immediately suspend or terminate the account and remove associated content."},{h:"3. ACCOUNT REGISTRATION",p:"To use certain features, you may be required to create an account. You agree to provide information that is accurate, current, and complete. You agree not to: create an account using false information; misrepresent your age; pretend to be another person; use another person's photographs without permission; create an account for another person without authorization; create multiple accounts for deceptive purposes; create accounts after being banned; use an account belonging to another person; or provide information intended to deceive."},{h:"4. AUTHENTICITY OF PROFILES",p:"Global Amor is designed around authentic interactions between adults. You agree that information contained in your profile should be truthful and not materially misleading. You must not intentionally misrepresent your identity, age, relationship status, location, occupation, photographs, intentions, financial circumstances, or other information where misrepresentation is intended to deceive."},{h:"5. INTENDED USE",p:"Global Amor may only be used for lawful purposes consistent with its purpose as an adult dating and social platform. You agree not to use the Service primarily for advertising unrelated products, recruiting customers or employees, MLM, affiliate marketing, political campaigning, fundraising, spam, data collection, market research without authorization, or any other commercial or non-dating purpose we deem inappropriate."},{h:"6. PROHIBITED COMMERCIAL AND SEXUAL SOLICITATION",p:"Global Amor is not a marketplace for sexual services. You may not use Global Amor to advertise, offer, arrange, promote, sell, purchase, or solicit prostitution, escort services, sexual services, sexual performances for compensation, paid dates, or any substantially similar commercial sexual arrangement. This prohibition applies whether compensation is offered directly or indirectly."},{h:"7. FINANCIAL SOLICITATION, SCAMS, AND FRAUD",p:"Global Amor strictly prohibits scams and fraudulent activity. Prohibited conduct includes asking another user for money, loans, gift cards, cryptocurrency, wire transfers, bank-account or credit-card information, promoting fake investments, romance scams, fake emergencies, advance-fee schemes, identity theft, money laundering, or any other fraudulent activity."},{h:"8. NO GUARANTEE OF USER IDENTITY",p:"Global Amor does not guarantee that any user is who they claim to be. Although we may implement verification and moderation, no system can guarantee that a person is genuine, safe, honest, or accurately represented. You are responsible for exercising your own judgment."},{h:"9. PERSONAL SAFETY",p:"Online dating involves inherent risks. You should: communicate through Global Amor before sharing personal contact; avoid disclosing sensitive personal info; never send money to someone you met online; meet in public; inform someone you trust about your plans; maintain control of your own transportation; and contact emergency services if necessary. We do not guarantee your safety."},{h:"10. OFFLINE MEETINGS",p:"Global Amor is not responsible for meetings that occur outside the Service. If you choose to meet another user in person, you do so at your own risk. We do not conduct background checks on every user and do not guarantee that a user has no criminal history."},{h:"11. HARASSMENT AND ABUSE",p:"You may not harass, intimidate, threaten, stalk, bully, abuse, or repeatedly contact another person against their wishes. This includes threats of violence, stalking, sexual harassment, extortion, blackmail, targeted harassment, hate-based harassment, threatening to disclose private or intimate images, or coordinating harassment."},{h:"12. NON-CONSENSUAL INTIMATE CONTENT",p:"You may not upload, send, distribute, or threaten to distribute intimate photographs or videos of another person without that person's consent. You may not use intimate images to threaten, blackmail, extort, humiliate, or retaliate. Global Amor may remove reported content and take appropriate action."},{h:"13. MINORS AND CHILD SAFETY",p:"Zero tolerance for sexual exploitation or abuse involving minors. You may not use the Service to contact minors for sexual purposes, request sexual images from a minor, share sexual content involving a minor, or facilitate exploitation or trafficking of minors. Any such activity may be reported to authorities."},{h:"14. ILLEGAL ACTIVITY",p:"You may not use Global Amor to plan, facilitate, encourage, advertise, or participate in unlawful activity, including fraud, theft, trafficking, money laundering, identity theft, threats, distribution of illegal substances, or sexual exploitation."},{h:"15. HATE, DISCRIMINATION, AND EXTREMIST CONTENT",p:"You may not use Global Amor to threaten, harass, or promote violence against individuals or groups based on protected characteristics. We may remove content that promotes violence or dehumanization."},{h:"16. CONTENT YOU MAY NOT POST",p:"You may not post unlawful, fraudulent, deceptive, infringing, private info without authorization, malicious software, criminal facilitation, exploitation material, non-consensual intimate content, threats, harassment, scams, spam, impersonation, or content that otherwise violates these Terms."},{h:"17. PHOTOS AND PROFILE CONTENT",p:"You are responsible for photos you upload. You must have necessary rights. Do not upload another person's photos without permission, images to impersonate, private images of another, images containing minors in inappropriate circumstances, or images designed to facilitate prohibited commercial activity."},{h:"18. MESSAGING",p:"You are responsible for your communications. You agree not to use messaging to spam, harass, threaten, solicit money or prohibited services, distribute malware or fraudulent links, or engage in unlawful activity. We may use automated systems, reports, and human review to identify violations, subject to Privacy Policy."},{h:"19. BLOCKING AND REPORTING",p:"We provide tools to block or report other users. Use them when another user violates these Terms. A report does not guarantee action. We may investigate in our discretion and may restrict an account while investigating."},{h:"20. MODERATION",p:"We reserve the right, but not the obligation, to monitor, review, moderate, restrict, remove, or investigate content and activity. We may take action when we believe Terms or safety policies have been violated, the Service is misused, an account poses risk, fraud may occur, or action is necessary to protect users."},{h:"21. SUSPENSION AND TERMINATION",p:"We may suspend, restrict, or terminate your account at any time where permitted by law for violation of Terms, safety rules, fraud, harassment, impersonation, prohibited solicitation, threats, ban circumvention, false information, or conduct harmful to the Service. Termination may result in loss of access to profile, messages, and account info."},{h:"22. BAN EVASION",p:"If your account has been suspended or terminated, you may not create another account or circumvent the restriction using different email, phone, device, false identity, or other methods. We may take additional action against accounts believed to be evading enforcement."},{h:"23. USER CONTENT",p:"You retain ownership of content you legally own and upload. By submitting content, you grant Global Amor a non-exclusive, worldwide, royalty-free, transferable license to host, store, reproduce, process, display, and distribute that content as necessary to operate, maintain, improve, and provide the Service."},{h:"24. CONTENT REMOVAL",p:"We may remove or disable access to content when we believe it violates these Terms, applicable law, safety requirements, or policies. We are not responsible for preserving removed content."},{h:"25. PRIVACY",p:"Your use is also subject to our Privacy Policy. It explains how we collect, use, store, and process personal information. By using Global Amor, you acknowledge you have reviewed the Privacy Policy."},{h:"26. THIRD-PARTY SERVICES AND LINKS",p:"Global Amor may contain links to third-party websites or services. We do not necessarily control or endorse third-party services. Your use of third-party services is governed by their terms. We are not responsible for third-party content or practices."},{h:"27. PAID FEATURES AND SUBSCRIPTIONS",p:"Certain features may require payment. Pricing, billing frequency, subscription terms, renewal, cancellation, and refund policies will be presented before purchase. Subscriptions may automatically renew until cancelled."},{h:"28. REFUNDS",p:"Refunds will be handled according to applicable purchase terms and applicable law. Where purchase is processed through a third-party app store, that provider's refund procedures may apply. Nothing limits non-waivable consumer rights."},{h:"29. INTELLECTUAL PROPERTY",p:"Global Amor branding, designs, software, logos, trademarks, text, graphics, and interfaces are owned by or licensed to Global Amor and protected by intellectual-property laws. You may not copy, reproduce, modify, distribute, or commercially exploit our proprietary materials without authorization."},{h:"30. PROHIBITED TECHNOLOGICAL ACTIVITY",p:"You may not attempt unauthorized access, circumvent security, introduce malware, scrape without authorization, reverse engineer except where legally permitted, interfere with operation, conduct denial-of-service attacks, or use the Service to develop competing databases using unauthorized data."},{h:"31. USER FEEDBACK",p:"If you provide suggestions or feedback, you grant us permission to use that feedback without compensation or obligation. Feedback does not create ownership interest."},{h:"32. DISCLAIMER REGARDING OTHER USERS",p:"GLOBAL AMOR DOES NOT GUARANTEE THE IDENTITY, AGE, CHARACTER, BACKGROUND, INTENTIONS, HONESTY, SAFETY, OR BEHAVIOR OF ANY USER. We do not guarantee users will meet, communicate honestly, or behave appropriately. You are solely responsible for your interactions."},{h:"33. NO GUARANTEE OF MATCHES",p:"Global Amor does not guarantee that you will receive matches, messages, meet another person, develop a relationship, or achieve any particular result. Results vary."},{h:"34. SERVICE PROVIDED “AS IS”",p:"TO THE MAXIMUM EXTENT PERMITTED BY LAW, GLOBAL AMOR PROVIDES THE SERVICE ON AN “AS IS” AND “AS AVAILABLE” BASIS. WE DO NOT GUARANTEE THAT THE SERVICE WILL ALWAYS BE AVAILABLE, ERROR-FREE, SECURE, UNINTERRUPTED, ACCURATE, OR FREE OF HARMFUL CONTENT."},{h:"35. LIMITATION OF LIABILITY",p:"TO THE MAXIMUM EXTENT PERMITTED BY LAW, GLOBAL AMOR WILL NOT BE LIABLE FOR INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, EXEMPLARY, OR PUNITIVE DAMAGES ARISING FROM YOUR USE OF THE SERVICE, INCLUDING INTERACTIONS WITH OTHER USERS, OFFLINE MEETINGS, USER CONTENT, FRAUDULENT ACTIVITY, OR UNAUTHORIZED CONDUCT."},{h:"36. INDEMNIFICATION",p:"You agree to defend, indemnify, and hold harmless Global Amor and its owners, officers, directors, employees, and affiliates from claims, damages, liabilities, losses, costs, and expenses arising from your use of the Service, violation of Terms, violation of law, your content, or your interactions with other users."},{h:"37. DISPUTE, GOVERNING LAW, CHANGES",p:"Any dispute will be handled in accordance with procedures required by applicable law. These Terms will be governed by laws of [STATE/COUNTRY]. We may update Terms from time to time with notice. Continued use after effective date constitutes acceptance. By creating an account, you consent to electronic communications concerning your account, transactions, security, and service updates."},{h:"38. SEVERABILITY, WAIVER, ENTIRE AGREEMENT",p:"If any provision is invalid, remaining provisions remain in effect. Failure to enforce is not a waiver. You may not transfer rights without consent. These Terms together with Privacy Policy constitute entire agreement. Contact: Legal/Support - Email [INSERT]. By selecting I Agree or creating an account, you acknowledge you are at least 18, have read Terms, agree to comply, will not use Service for prostitution, scams, fraud, harassment, or illegal activity, and understand violation may result in removal and reporting to authorities."}]},privacy:{title:"PRIVACY POLICY",updated:"Last Updated: May 2025 • Minimal data by design",intro:"At Global Amor we collect minimal data by design. We believe travel connection should be warm, minimal, and real — not data mining.",sections:[{h:"What we collect",p:"Only what you provide: profile info (name, age, city, bio, photo), wall posts, merch listings (title, price, vendor, WhatsApp), and messages. No background tracking, no ad pixels, no selling of data."},{h:"Where it's stored",p:"In Supabase (PostgreSQL) with row-level security. Photos via Supabase Storage or URLs you provide. In this preview/demo, data is local in-memory only. WhatsApp contacts are direct links — we never see those chats."},{h:"How it's used",p:"Only to power community features: Discover profiles, Community Merch, Wall feed, and private Inbox. Admins see pending profiles for moderation only, never private messages. We do not use data for ads."},{h:"What we don't do",p:"We do not sell your data. We do not share with advertisers. We do not mine contacts. We do not build shadow profiles. No facial recognition."},{h:"Your rights",p:"You can request deletion of your profile, posts, and merch at any time. Contact admin. We will remove within 72 hours in production. You can also request export of your data."},{h:"Retention & Safety",p:"We keep only what's needed. Inactive profiles may be archived after 12 months. We use automated systems, reports, and human review to identify violations, subject to applicable law. If you believe under-18 use is occurring, report immediately."},{h:"Third parties",p:"Links to WhatsApp, Unsplash images, and external vendors are governed by their policies. We are not responsible for third-party practices. Be cautious when sharing personal info offline."}]},conditions:{title:"COMMUNITY CONDITIONS",updated:"Rules for a respectful commons • Last Updated: May 2025",intro:"These Conditions supplement our Terms. Global Amor is a travel commons, not a marketplace for exploitation. Respect is non-negotiable.",sections:[{h:"1. 18+ and Real Identity",p:"All members must be 18 or older and use real, recent photos. No AI-generated, celebrity, or stolen images. No impersonation. One person, one authentic profile."},{h:"2. Respectful Interaction",p:"No harassment, intimidation, stalking, bullying, hate, or repeated contact against wishes. No threats, extortion, blackmail, or humiliation. One warning for minor issues, then removal. Severe violations = immediate ban."},{h:"3. No Explicit Content Without Consent",p:"Nudity or explicit imagery is not allowed on public wall or profiles. Private sharing requires explicit, enthusiastic mutual consent in chat. No non-consensual intimate content, ever. Threatening to distribute intimate images is prohibited."},{h:"4. No Commercial Spam Outside Merch",p:"No solicitation outside approved Community Merch tab. No MLM, crypto, investment, gambling, or off-platform sales pitches in DMs. No escort, prostitution, or paid sexual services advertising."},{h:"5. Financial Safety",p:"Never send money, gift cards, crypto, or bank info to someone you met online. Romance scams are banned. Report any request for money immediately. We will suspend suspected fraud accounts pending review."},{h:"6. Real Meetups = Safety First",p:"Verify identity via video call, meet in public, share itinerary with a friend, control your own transportation, avoid excessive substances on first meeting. Global Amor is not liable for offline meetings. You are responsible for your own safety decisions."},{h:"7. Report & Enforce",p:"Report violations via Admin tab. We review within 24h in production. We may restrict accounts while investigating. Ban evasion using different email, phone, device, or false identity is prohibited and leads to additional action."}]}},ES:{terms:{title:"TÉRMINOS DE SERVICIO",updated:"Actualizado: Mayo 2025",intro:"Bienvenido a Global Amor. Estos Términos rigen tu acceso y uso del Servicio. Al crear cuenta o usar el Servicio, confirmas que has leído y aceptas estos Términos. SI NO ESTÁS DE ACUERDO, NO USES GLOBAL AMOR.",sections:[{h:"1. PROPÓSITO",p:"Global Amor es una plataforma de citas y conexión social para adultos que buscan descubrir, comunicarse y desarrollar relaciones personales o románticas. Uso genuino, no publicidad."},{h:"2. SOLO 18+",p:"Solo para mayores de 18. Debes confirmar edad. Si descubrimos menores de 18, suspendemos cuenta inmediatamente."},{h:"3. REGISTRO",p:"Información veraz y actual. Prohibido: información falsa, suplantación, usar fotos ajenas sin permiso, múltiples cuentas engañosas, crear cuenta tras baneo."},{h:"4. AUTENTICIDAD",p:"Perfiles deben ser veraces. No suplantar identidad, edad, ubicación, fotos o intenciones para engañar."},{h:"5-7. USO Y PROHIBICIONES",p:"Prohibido uso comercial no relacionado con citas, spam, captación, solicitud sexual comercial (prostitución, escorts, citas pagadas), estafas financieras, pedir dinero, gift cards, cripto, inversiones falsas."},{h:"8-11. IDENTIDAD, SEGURIDAD Y ACOSO",p:"No garantizamos identidad de usuarios. Debes tomar precauciones. Prohibido acoso, amenazas, acecho, extorsión, chantaje, divulgación de imágenes íntimas."},{h:"12-16. CONTENIDO PROHIBIDO",p:"Tolerancia cero a explotación infantil. Prohibido contenido íntimo no consensuado, actividad ilegal, odio, discriminación, malware, fraude

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENCUENTRO - Travel. Connect. Belong.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.serif{font-family:'Fraunces',serif}</style>
</head>
<body class="bg-[#FFF9F0] text-[#1A1A1A]">
<nav class="flex justify-between items-center p-6 max-w-7xl mx-auto">
  <div class="font-bold text-xl tracking-widest">ENCUENTRO</div>
  <button id="navAuth" class="bg-black text-white px-6 py-2 rounded-full text-sm">Sign in</button>
</nav>
<section class="max-w-7xl mx-auto px-6 py-16 grid md:grid-cols-2 gap-12 items-center">
  <div>
    <h1 class="serif text-5xl md:text-7xl leading-[0.9]">Travel.<br>Connect.<br><span class="text-[#FF5A2C]">Belong.</span></h1>
    <p class="mt-6 text-lg text-neutral-600 max-w-md">Premium travel dating for explorers who want more than a tourist trap. Find people where you're going, not just where you are.</p>
    <div class="mt-8 flex gap-3">
      <button id="ctaJoin" class="bg-black text-white px-8 py-4 rounded-full font-semibold">Join Encuentro</button>
      <button class="border border-black px-8 py-4 rounded-full">How it works</button>
    </div>
  </div>
  <div class="bg-white rounded-[2rem] p-4 shadow-2xl rotate-1">
    <div class="bg-neutral-100 rounded-[1.5rem] h-[480px] flex items-center justify-center">
      <div class="text-center">
        <div class="text-6xl">✈️</div>
        <p class="mt-4 font-semibold">Feed preview coming next</p>
        <p class="text-sm text-neutral-500">profiles • avatars • cities</p>
      </div>
    </div>
  </div>
</section>
<div id="authModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur flex items-center justify-center p-6 z-50">
  <div class="bg-white rounded-3xl p-8 w-full max-w-md">
    <h2 class="serif text-3xl">Welcome</h2>
    <p class="text-sm text-neutral-500 mt-2">Use email to continue. 18+ only.</p>
    <input id="email" type="email" placeholder="you@email.com" class="mt-6 w-full border rounded-full px-5 py-3">
    <input id="password" type="password" placeholder="password (min 6)" class="mt-3 w-full border rounded-full px-5 py-3">
    <button id="signUpBtn" class="mt-4 w-full bg-black text-white py-3 rounded-full">Create account</button>
    <button id="signInBtn" class="mt-2 w-full border py-3 rounded-full">Sign in</button>
    <button id="closeModal" class="mt-4 w-full text-sm text-neutral-500">Close</button>
    <p id="authMsg" class="mt-3 text-sm text-center"></p>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://ygacbyhuetmwfcayuixv.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_T17mfdgegtiNJx8L7JqHRQ_BAodjoG9'
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const modal = document.getElementById('authModal')
document.getElementById('navAuth').onclick = () => modal.classList.remove('hidden')
document.getElementById('ctaJoin').onclick = () => modal.classList.remove('hidden')
document.getElementById('closeModal').onclick = () => modal.classList.add('hidden')
async function checkProfile() {
  const { data: { user } } = await supabaseClient.auth.getUser()
  if (!user) return
  const { data } = await supabaseClient.from('profiles').select('id').eq('id', user.id).single()
  if (!data) window.location.href = './onboarding.html'
  else window.location.href = './feed.html'
}
document.getElementById('signUpBtn').onclick = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { error } = await supabaseClient.auth.signUp({ email, password })
  document.getElementById('authMsg').textContent = error? error.message : 'Check email to confirm! Then sign in.'
  if (!error) setTimeout(checkProfile, 1000)
}
document.getElementById('signInBtn').onclick = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password })
  document.getElementById('authMsg').textContent = error? error.message : 'Signed in!'
  if (!error) checkProfile()
}
checkProfile()
</script>
</body>
</html>
